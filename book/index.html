<body>
<div id="app"><div class="card muted">Loading…</div></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
// Waikato Interlocks booking engine — sequential slot logic.
// No dependencies. All dates are NZ-local "YYYY-MM-DD" strings and all times are
// minutes after midnight, because every location is in one time zone.
//
// Core rule (matches how Timely is set up today with "minimise gaps"):
//   a customer is only ever offered ONE time per session — the earliest unbooked slot.
//   Cambridge Tue 9:20–10:10 with 5-min slots: first person sees 9:20, next sees 9:25 …
//   If someone cancels 9:30, the next customer is offered 9:30 (gap gets filled first).

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---------- date helpers (pure, timezone-free) ----------
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function fmtDate(dt) {
  return dt.toISOString().slice(0, 10);
}
function addDays(s, n) {
  const dt = parseDate(s);
  dt.setUTCDate(dt.getUTCDate() + n);
  return fmtDate(dt);
}
function weekday(s) {
  return parseDate(s).getUTCDay();
}
function hm(str) {
  // "9:20" -> 560
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, '0')}${ap}`;
}
// Which occurrence of its weekday a date is in its month: 1..5 ; and whether it is the last.
function nthOfMonth(s) {
  const d = parseDate(s).getUTCDate();
  const n = Math.ceil(d / 7);
  const isLast = parseDate(addDays(s, 7)).getUTCMonth() !== parseDate(s).getUTCMonth();
  return { n, isLast };
}

// ---------- recurrence ----------
// rule shapes:
//   { type: 'weekly',  weekdays: [2,4] }                 every Tue + Thu
//   { type: 'weekly',  weekdays: [2], everyNWeeks: 2, anchor: '2026-11-03' }  fortnightly
//   { type: 'monthly', weekday: 3, nth: 1 }               first Wednesday
//   { type: 'monthly', weekday: 5, nth: 'last' }          last Friday
//   { type: 'once',    date: '2026-12-23' }               one-off session
function ruleMatches(rule, date) {
  const wd = weekday(date);
  switch (rule.type) {
    case 'weekly': {
      if (!rule.weekdays.includes(wd)) return false;
      if (!rule.everyNWeeks || rule.everyNWeeks === 1) return true;
      const diffDays = Math.round((parseDate(date) - parseDate(rule.anchor)) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      return diffDays >= 0 && weeks % rule.everyNWeeks === 0;
    }
    case 'monthly': {
      if (wd !== rule.weekday) return false;
      const { n, isLast } = nthOfMonth(date);
      return rule.nth === 'last' ? isLast : n === rule.nth;
    }
    case 'once':
      return rule.date === date;
    default:
      return false;
  }
}

// ---------- sessions ----------
// A "schedule" is a standing pattern for a location, e.g. Cambridge Tue 9:20–10:10.
// schedule: { id, locationId, rule, start:'9:20', end:'10:10', slotMins:5, validFrom?, validTo? }
// exception: { locationId, date, kind:'closed' }                         — skip that day
//            { locationId, date, kind:'override', start, end, note? }     — different hours that day
//            { locationId, date, kind:'moved', toLocationId?, note }      — e.g. changed meeting point
function sessionsForRange({ schedules, exceptions = [], locations = [] }, fromDate, toDate) {
  const out = [];
  for (let d = fromDate; d <= toDate; d = addDays(d, 1)) {
    for (const s of schedules) {
      if (s.validFrom && d < s.validFrom) continue;
      if (s.validTo && d > s.validTo) continue;
      if (!ruleMatches(s.rule, d)) continue;
      const loc = locations.find(l => l.id === s.locationId);
      if (loc && loc.active === false) continue;
      const exs = exceptions.filter(e => e.locationId === s.locationId && e.date === d);
      if (exs.some(e => e.kind === 'closed')) continue;
      const ov = exs.find(e => e.kind === 'override');
      const start = hm(ov ? ov.start : s.start);
      const end = hm(ov ? ov.end : s.end);
      const notes = exs.filter(e => e.note).map(e => e.note);
      out.push({
        id: `${s.locationId}@${d}@${start}`,
        scheduleId: s.id,
        locationId: s.locationId,
        date: d,
        start,
        end,
        slotMins: s.slotMins || 5,
        // Removals are floating placeholders (see removalEstimates): up to removalSlots per session
        removalSlots: s.removalSlots ?? 3,
        removalMins: s.removalMins ?? 15,
        notes,
      });
    }
  }
  return out.sort((a, b) => (a.date + String(a.start).padStart(4, '0')).localeCompare(b.date + String(b.start).padStart(4, '0')));
}

// All slot start times in a session that fit a service of `durationMins`.
function slotTimes(session, durationMins = session.slotMins) {
  const times = [];
  for (let t = session.start; t + durationMins <= session.end; t += session.slotMins) times.push(t);
  return times;
}

// Is [t, t+dur) free given existing bookings (each {start, duration, status})?
function isFree(t, dur, bookings) {
  return !bookings.some(b => b.status !== 'cancelled' && t < b.start + b.duration && b.start < t + dur);
}

function leadTimeOk(date, t, now, cutoffMins) {
  const dayDiff = Math.round((parseDate(date) - parseDate(now.date)) / 86400000);
  const minsUntil = dayDiff * 1440 + t - now.minutes;
  return minsUntil >= cutoffMins;
}

// ---------- removals: floating placeholders ----------
// A removal does NOT hold a time. It is a placeholder that sits at the first free gap in the
// session and slides later whenever a service or violation reset books that time:
//   removal requested when 11:30 is free -> shows "about 11:30"; someone books a service at 11:30
//   -> the removal now shows "about 11:35", and so on.
// It only becomes a solid, held time once Matt has approved it AND times are locked on the
// morning of the session. Until then services always win.
// booking fields used: { id, start, duration, status, kind, timeLocked, approvedAt, createdAt }
//   timeLocked === false  -> floating removal;  anything else -> fixed (holds its time)
const isFloating = b => b.kind === 'removal' && b.timeLocked === false && b.status !== 'cancelled';
// timeLocked === false on anything else (e.g. a walk-in sale) means it is on the sheet but holds no slot
const isFixed = b => b.status !== 'cancelled' && b.timeLocked !== false;

// Estimated time for every floating removal in this session: Map(bookingId -> minutes).
// Approved ones are placed first, then in the order they were requested.
function removalEstimates(session, bookings, { onlyApproved = false, extra = 0 } = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const fixed = sess.filter(isFixed).map(b => ({ start: b.start, duration: b.duration, status: 'confirmed' }));
  const floaters = sess.filter(isFloating).filter(b => !onlyApproved || b.approvedAt)
    .map((b, i) => ({ b, i }))
    .sort((x, y) => (!x.b.approvedAt - !y.b.approvedAt) || String(x.b.createdAt || '').localeCompare(String(y.b.createdAt || '')) || x.i - y.i)
    .map(x => x.b);
  const out = new Map();
  const place = () => {
    let t = session.start;
    while (!isFree(t, session.removalMins, fixed)) t += session.slotMins;
    fixed.push({ start: t, duration: session.removalMins, status: 'confirmed' });
    return t;
  };
  for (const b of floaters) out.set(b.id, place());
  for (let i = 0; i < extra; i++) out.set(`new${i}`, place());   // where the NEXT request would sit
  return out;
}

// Morning of the session: approved removals take a solid time and now hold it. Unapproved ones stay floating.
function lockRemovals(session, bookings) {
  const est = removalEstimates(session, bookings, { onlyApproved: true });
  return bookings.map(b => est.has(b.id) ? { ...b, start: est.get(b.id), timeLocked: true, status: 'confirmed' } : b);
}

// The ONE time offered to a customer for this session, or null if full.
// Services / resets: earliest 5-min slot not held by a service or a LOCKED removal (floating removals are ignored).
// Removals: an approximate time only — null once the session has its limit of removals (default 3).
// opts.now = { date, minutes } (NZ local), opts.cutoffMins = min lead time (Timely: 3 hours)
function nextOfferedSlot(session, bookings, durationMins = session.slotMins, opts = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const cutoff = opts.cutoffMins ?? 180;
  if (opts.kind === 'removal') {
    if (sess.filter(b => b.kind === 'removal' && b.status !== 'cancelled').length >= session.removalSlots) return null;
    if (opts.now && !leadTimeOk(session.date, session.start, opts.now, cutoff)) return null;
    return removalEstimates(session, bookings, { extra: 1 }).get('new0');
  }
  const fixed = sess.filter(isFixed);
  for (const t of slotTimes(session, durationMins)) {
    if (!isFree(t, durationMins, fixed)) continue;
    if (opts.now && !leadTimeOk(session.date, t, opts.now, cutoff)) continue;
    return t;
  }
  return null;
}

// What the customer app shows: one row per upcoming session with its single offered time.
// horizonDays: Timely is currently set to 3 weeks ahead.
function customerAvailability(data, bookings, { fromDate, horizonDays = 21, durationMins = 5, kind = 'service', now, cutoffMins = 180, locationId } = {}) {
  const toDate = addDays(fromDate, horizonDays);
  return sessionsForRange(data, fromDate, toDate)
    .filter(s => !locationId || s.locationId === locationId)
    .map(s => ({ session: s, offered: nextOfferedSlot(s, bookings, durationMins, { now, cutoffMins, kind }) }))
    .filter(r => r.offered !== null);
}

// Create a booking — re-checks the slot so two people tapping at once can't both get 9:25.
// (In the real backend this is enforced by a unique index on (location, date, start) inside a transaction.)
// Services and resets are auto-confirmed and hold their time. Removals are floating placeholders:
// pencilled, no held time, until Matt approves and times are locked on the morning.
function book(session, bookings, { customerId, serviceId, kind = 'service', durationMins = 5, requestedStart, now, cutoffMins = 180, customer, details = {} }) {
  if (kind === 'removal' && customer) {
    const req = removalRequirements(customer, session.date);
    if (req.temporary && !String(details.nztaApprovalRef || '').trim()) {
      return { ok: false, reason: 'This is before your apply date, so NZTA temporary removal approval is needed', needs: req.needs };
    }
    if (!req.temporary && !details.zeroAlcoholLicencePhoto) {
      return { ok: false, reason: 'Add a photo of your zero alcohol licence to request a removal', needs: req.needs };
    }
    if (req.temporary) details = { ...details, temporary: true };
  }
  const offered = nextOfferedSlot(session, bookings, durationMins, { now, cutoffMins, kind });
  if (offered === null) return { ok: false, reason: kind === 'removal' ? 'No removal spots left that day' : 'Session full' };
  if (kind !== 'removal' && requestedStart !== undefined && requestedStart !== offered) {
    return { ok: false, reason: 'That time was just taken', offered };
  }
  const booking = {
    id: `bk_${session.id}_${kind}_${kind === 'removal' ? 'float' : offered}_${customerId}`,
    sessionId: session.id,
    locationId: session.locationId,
    date: session.date,
    start: offered,
    duration: kind === 'removal' ? session.removalMins : durationMins,
    customerId,
    serviceId,
    kind,
    status: kind === 'removal' ? 'pencilled' : 'confirmed',
    timeLocked: kind !== 'removal',   // removals float until approved + locked
    approvedAt: null,
    details,
  };
  return { ok: true, booking };
}

// ---------- customer rules ----------
// Customer: { installDate, subsidised, subsidyStart?, subsidyMonths=15, theftProtection, blockedServiceIds? }
function addMonths(s, n) {
  const dt = parseDate(s);
  const day = dt.getUTCDate();
  dt.setUTCDate(1);
  dt.setUTCMonth(dt.getUTCMonth() + n);
  const lastDay = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(day, lastDay));
  return fmtDate(dt);
}

// Subsidy runs 15 months from install, or from the later date they obtained it (subsidyStart).
function customerDates(c, today) {
  const subStart = c.subsidised ? (c.subsidyStart || c.installDate) : null;   // the date on the NZTA subsidy letter if we have it, else the install date
  const subsidyEnds = subStart ? addMonths(subStart, c.subsidyMonths ?? 15) : null;
  const standardExit = c.installDate ? addMonths(c.installDate, 12) : null;
  return {
    // Apply-for-removal date: 12 months after install, unless NZTA gave a new date after a denial
    // (the customer can enter that themselves — see setApplyDate).
    exitEligible: c.applyDate || standardExit,
    standardExit,
    applyDateSource: c.applyDate ? (c.applyDateSetBy || 'customer') : 'install',
    subsidyStart: subStart,
    subsidyEnds,
    // The subsidy stays ACTIVE until staff switch it off (when Dräger emails to say it has ended).
    // subsidyEnds is only the expected end; subsidyOverdue flags that the 15 months have passed.
    subsidyActive: !!c.subsidised,
    subsidyOverdue: !!c.subsidised && !!subsidyEnds && !!today && today >= subsidyEnds,
  };
}

// Monthly service window = rollover day-of-month each month, ±7 days.
// The rollover date is the install date unless it was changed (e.g. a second device was fitted later).
// `servicedDates` = days a MONTHLY SERVICE was actually done and charged (not a violation reset or a
// data reading). A window that already has one is finished, so the next month's window is returned.
// A service up to 20 days before the due date counts for that month (an early visit; the previous
// month's window has closed by then).
// `c.dueOverrides` = [{ normal_due, due }]: Matt moved that one month's due date (e.g. over Christmas).
// The month after goes back to the normal day.
const EARLY_SERVICE_DAYS = 20;
function serviceWindow(c, onOrAfter, servicedDates = []) {
  const anchor = c.rolloverDate || c.installDate;
  if (!anchor) return null;
  for (let i = 0; i < 600; i++) {
    const normalDue = addMonths(anchor, i);
    if (i === 0 && !c.rolloverDate) continue;   // install day itself is not a service
    const ov = (c.dueOverrides || []).find(o => o.normal_due === normalDue);
    const due = ov ? ov.due : normalDue;
    const opens = addDays(due, -7), closes = addDays(due, 7);
    if (closes < onOrAfter) continue;
    if (servicedDates.some(d => d >= addDays(due, -EARLY_SERVICE_DAYS) && d <= closes)) continue;   // this month's service is done
    return { due, normalDue, moved: !!ov, opens, closes };
  }
  return null;
}
// The days a customer had their monthly service, from their bookings: completed, and the thing charged was the service itself.
function servicedDates(bookings, services) {
  return bookings.filter(b => b.status === 'completed' && (services.find(s => s.id === b.service_id) || {}).group === 'service').map(b => b.session_date);
}

// Exactly what this customer is allowed to book, worked out from their profile:
//  - ONE monthly service: subsidised or full price (by subsidy dates) × with/without theft protection
//  - both violation resets
//  - removal: from the apply date as normal; before it only as a temporary removal with NZTA approval
//    (free while still subsidised)
//  - changeover to another vehicle (request only, needs vehicle details)
//  - minus anything Matt has switched off for them (blockedServiceIds)
function allowedServices(c, services, today) {
  const d = customerDates(c, today);
  const tp = c.theftProtection !== false;
  const out = [];
  const monthly = services.find(s => s.group === 'service' && !!s.subsidised === d.subsidyActive && !!s.theftProtection === tp);
  if (monthly) out.push(monthly);
  out.push(...services.filter(s => s.group === 'violation'));
  const rem = services.find(s => s.group === 'removal');
  if (rem && c.installDate) {
    const early = !!d.exitEligible && today < d.exitEligible;
    out.push({ ...rem, price: d.subsidyActive ? 0 : rem.price,
      note: [d.subsidyActive ? 'Free while subsidised' : null, early ? 'Before your apply date — needs NZTA temporary removal approval' : null].filter(Boolean).join(' · ') || null });
  }
  out.push(...services.filter(s => s.group === 'changeover'));
  return out.filter(s => s.onlineBookable && !(c.blockedServiceIds || []).includes(s.id));
}

// Customer enters the new apply date NZTA gave them after a denied application.
// Returns the updated customer, or { error } if the date doesn't make sense.
function setApplyDate(c, newDate, { today, setBy = 'customer' } = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate || '') || isNaN(parseDate(newDate))) return { error: 'Enter the date NZTA gave you' };
  if (c.installDate && newDate <= c.installDate) return { error: 'That date is before your install date' };
  if (today && newDate < addDays(today, -365)) return { error: 'That date is more than a year ago — check the letter from NZTA' };
  return { customer: { ...c, applyDate: newDate, applyDateSetBy: setBy, applyDateSetOn: today || null } };
}

// To apply for removal NZTA needs a service AFTER the apply date.
// If a SERVICE booking falls in the last `warnDays` before the apply date, advise booking on/after it,
// and suggest the first session that day or later (from the availability list the app already has).
function applyDateAdvice(c, sessionDate, availability = [], { warnDays = 7, serviceGroup = 'service' } = {}) {
  const { exitEligible } = customerDates(c);
  if (!exitEligible) return null;
  if (!(sessionDate >= addDays(exitEligible, -warnDays) && sessionDate < exitEligible)) return null;
  const better = availability.find(r => r.session.date >= exitEligible) || null;
  const daysShort = Math.round((parseDate(exitEligible) - parseDate(sessionDate)) / 86400000);
  return {
    applyDate: exitEligible,
    daysShort,
    message: `This is ${daysShort} day${daysShort === 1 ? '' : 's'} before your apply date. To apply for removal you need a service on or after ${exitEligible}.`,
    suggestion: better, // { session, offered } or null if nothing in the booking horizon yet
  };
}

// Removal on/after the apply date = end of programme: photo of the zero alcohol licence required.
function removalRequirements(c, sessionDate) {
  const { exitEligible } = customerDates(c);
  const temporary = !!exitEligible && sessionDate < exitEligible;

  return { temporary, needs: temporary ? ['nztaApprovalRef'] : ['zeroAlcoholLicencePhoto'], applyDate: exitEligible };

      const data = await fileB64(blob);

async function start() {
  const qs = new URLSearchParams(location.search);
  const payTok = qs.get('pay');
  if (payTok) return renderPay(payTok);
  if (qs.has('new')) return renderEnquiry();
  if (qs.has('help')) return renderPublicHelp();
  const authErr = urlAuthError();
  if (authErr) return renderLogin(authErr);
  try {
    const { data } = await withTimeout(db.auth.getSession(), 15000, 'Checking login');
    if (!data.session) return renderLogin();
    S.user = data.session.user;
    const { data: linked, error } = await withTimeout(db.rpc('link_me'), 15000, 'Finding your details');
    if (error) return renderLogin(errMsg(error));
    if (!linked) return renderNoMatch();
    await load(); render();
  } catch (e) { renderLogin(errMsg(e)); }
}

// ---------- data ----------
async function load() {
  const today = nzToday();
  const [me, bk, av, rav, rt, rq, sd, sg] = await withTimeout(Promise.all([
    db.rpc('my_profile'),
    db.from('bookings').select('*').gte('session_date', addDays(today, -60)).neq('status', 'cancelled').order('session_date'),
    db.rpc('my_availability', { p_kind: 'service' }),
    db.rpc('my_availability', { p_kind: 'removal' }),
    db.rpc('my_removal_times'),
    db.from('service_requests').select('*').order('created_at', { ascending: false }).limit(3),
    db.rpc('my_sign_docs'), db.rpc('my_signed_docs')]), 20000, 'Loading');
  const bad = [me, bk, av, rav, rt, rq].find(r => r.error); if (bad) throw bad.error;
  S.me = me.data; S.signDocs = sd.error ? [] : (sd.data || []); S.signedDocs = sg.error ? [] : (sg.data || []); S.bookings = bk.data; S.rTimes = rt.data || []; S.requests = rq.data || [];
  const byDay = (a, b) => (a.session_date + String(a.offered_min).padStart(4, '0')).localeCompare(b.session_date + String(b.offered_min).padStart(4, '0'));
  S.avail = (av.data || []).sort(byDay); S.rAvail = (rav.data || []).sort(byDay);
}
async function reload(msg) { try { await load(); } catch (e) { return toast(errMsg(e), true); } render(); if (msg) toast(msg); }

      const w = Math.max(90, Math.min(200, (date ? date.transform[4] - 12 : x + 190) - x));

  try {
    const { data, error } = await withTimeout(db.storage.from('sign-docs').download(doc.file_path), 30000, 'Opening the document');
    if (error) throw error;
    bytes = new Uint8Array(await data.arrayBuffer());
    await loadScript(PDFJS); await loadScript(PDFJS_WORKER);   // the worker runs on the page (no separate worker needed)
    const pdf = await window.pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false, disableFontFace: true }).promise;
    const box = $('sgPages'); if (!box) return;
    const wCss = Math.min(box.clientWidth || 360, 820), dpr = Math.min(window.devicePixelRatio || 1, 2);
    box.innerHTML = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i), vp = pg.getViewport({ scale: wCss / pg.getViewport({ scale: 1 }).width * dpr });
      const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      c.setAttribute('aria-label', 'Page ' + i + ' of ' + pdf.numPages);
      c.style.cssText = 'width:100%;display:block;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff';
      box.appendChild(c);
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      if (i === 1) { spot = await findSigSpot(pg); inst = await findSigSpot(pg, /installer/i); }
    }
  } catch (e) {
    if ($('sgPages')) $('sgPages').innerHTML = `<div class="note bad">Could not open the document: ${esc(errMsg(e))}. Try again, or text Matt on ${MATT}.</div>`;
    return;
  }
  $('sgCard').hidden = false;
  const pad = signPad($('sgPad'));
  $('sgClear').onclick = () => pad.clear();
  $('sgPad').addEventListener('pointerdown', () => { $('sgMsg').hidden = true; });
  const fail = m => { const b = $('sgMsg'); b.textContent = m; b.hidden = false; $('sgGo').disabled = false; $('sgGo').textContent = 'Sign and send'; };
  $('sgGo').onclick = async () => {
    $('sgMsg').hidden = true;
    const name = $('sgName').value.trim();
    if (pad.ink() < 40) return fail('Please sign in the box first.');
    if (name.length < 3) return fail('Please type your full name.');
    if (!$('sgOk').checked) return fail('Please tick the box to say you have read it and agree.');
    $('sgGo').disabled = true; $('sgGo').textContent = 'Sending…';
    try {
      await loadScript(PDFLIB);
      const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
      const doc2 = await PDFDocument.load(bytes, { ignoreEncryption: true });
      const page = doc2.getPage(0), H = page.getHeight();
      const sp = spot || { x: SIG_FALLBACK.x, y: H - SIG_FALLBACK.bottom, w: SIG_FALLBACK.w, h: 34 };
      const cut = trimSig($('sgPad')); if (!cut) return fail('Please sign in the box first.');
      const sigB64 = cut.toDataURL('image/png').split(',')[1];
      const put = (im, at) => { const k = Math.min(at.w / im.width, at.h / im.height); page.drawImage(im, { x: at.x + 2, y: at.y, width: im.width * k, height: im.height * k }); };
      const img = await doc2.embedPng(cut.toDataURL('image/png'));
      put(img, sp);
      if (inst) {   // the installer's line: Matt's own signature, saved from the one he signed himself
        if (asInstaller) put(img, inst);
        else { const r = await db.rpc('sign_doc_installer_sig', { p_id: doc.id }); if (!r.error && r.data) put(await doc2.embedPng('data:image/png;base64,' + r.data), inst); }
      }
      const font = await doc2.embedFont(StandardFonts.Helvetica);
      const when = new Date().toLocaleString('en-NZ', { timeZone: 'Pacific/Auckland', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      const ascii = t => t.normalize('NFD').replace(/[^\x20-\x7e]/g, '');
      page.drawText(ascii(`Signed electronically by ${name}, ${when} (Waikato Interlocks app)`), { x: sp.x + 2, y: sp.y - 9, size: 5, font, color: rgb(0.3, 0.3, 0.3) });
      const out = await doc2.save();
      if (!asInstaller) {   // keep a copy so it can be opened again from the Me tab (a failed save must not stop the signing)
        try { await withTimeout(db.storage.from('sign-docs').upload(`${S.me.id}/signed/${doc.id}.pdf`, new Blob([out], { type: 'application/pdf' }), { contentType: 'application/pdf' }), 30000, 'Saving your copy'); } catch (e) {}
      }
      const { data, error } = await withTimeout(db.rpc('sign_doc_submit', { p_id: doc.id, p_pdf_b64: toB64(out), p_name: name, p_sig_png: asInstaller ? sigB64 : null }), 45000, 'Sending');
      if (error) throw error;
      db.storage.from('sign-docs').remove([doc.file_path]).catch(() => {});
      await reload(data && data.installer_saved ? 'Signed. Your installer signature is saved.' : data && data.emailed_you ? 'Signed. A copy has been emailed to you.' : 'Signed and sent to Matt.');
      scrollTo(0, 0);
    } catch (e) { fail(errMsg(e)); }
  };
}

// ---------- add to calendar ----------
// NZ local date + minutes -> UTC Date (handles daylight saving via the browser's time zone data)
function nzToUtc(date, mins) {
  const [y, m, d] = date.split('-').map(Number);
  const want = Date.UTC(y, m - 1, d, Math.floor(mins / 60), mins % 60);
  let t = want;
  for (let i = 0; i < 2; i++) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Pacific/Auckland', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      .formatToParts(new Date(t)).map(x => [x.type, x.value]));
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    t += want - shown;
  }
  return new Date(t);
}
const icsTime = dt => dt.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
function calEvent(b, est) {
  const l = LOC(b.location_id), rem = b.kind === 'removal', fl = rem && b.time_locked === false;
  const start = nzToUtc(b.session_date, est), end = new Date(start.getTime() + (rem ? 15 : 10) * 60000);
  const title = 'Interlock ' + (rem ? (b.details?.temporary ? 'temporary removal' : 'removal') : b.service_id === 'data' ? 'data reading' : 'service') + ' – Waikato Interlocks';
  const desc = (fl ? 'Approximate time – it can move later and is confirmed on the morning. ' : '') +
    (b.price_cents ? 'To pay on the day: ' + money(b.price_cents / 100) + '. ' : '') + 'Questions: text Matt on ' + MATT + '.';
  return { title, desc, where: l.name + (l.address ? ', ' + l.address : ''), start, end, uid: b.id + '@waikato-interlocks' };
}
function downloadIcs(ev) {
  const esc2 = t => String(t).replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Waikato Interlocks//Booking//EN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + ev.uid, 'DTSTAMP:' + icsTime(new Date()), 'DTSTART:' + icsTime(ev.start), 'DTEND:' + icsTime(ev.end),
    'SUMMARY:' + esc2(ev.title), 'LOCATION:' + esc2(ev.where), 'DESCRIPTION:' + esc2(ev.desc),
    'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(ev.title), 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: 'interlock-booking.ics' });
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const googleCalUrl = ev => 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.title) +
  '&dates=' + icsTime(ev.start) + '/' + icsTime(ev.end) + '&location=' + encodeURIComponent(ev.where) + '&details=' + encodeURIComponent(ev.desc);

function bookingCard(b) {
  const l = LOC(b.location_id), rem = b.kind === 'removal', fl = rem && b.time_locked === false;
  const est = fl ? (S.rTimes.find(x => x.booking_id === b.id) || {}).est_min ?? b.start_min : b.start_min;

    <div class="chips"><button class="chip" data-ics="${b.id}">Add to calendar</button><a class="chip" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(googleCalUrl(calEvent(b, est)))}">Google Calendar</a></div>

function wireCancel() {
  document.querySelectorAll('[data-ics]').forEach(x => x.onclick = () => {

}

const EXIT_FORM = 'https://www.nzta.govt.nz/driver-licences/driving-offences-and-penalties/alcohol-sentencing/alcohol-interlock-programme/exit-aid/';
const EXIT_DAYS = 2;   // NZTA allows 48 hours between the data reading and the application; we recommend 24
const EXIT_SVC = ['svc-tp', 'svc', 'sub-tp', 'sub', 'data'];   // a violation reset on its own does not count as the reading visit
function exitCard(d, today, w) {
  if (!d.exitEligible || today < d.exitEligible || live('removal')) return '';   // a removal booked means NZTA has approved it
  const visits = S.bookings.filter(b => b.kind === 'service' && EXIT_SVC.includes(b.service_id) && !['cancelled', 'no_show'].includes(b.status));
  const back = addDays(today, -EXIT_DAYS), from = back > d.exitEligible ? back : d.exitEligible;
  const done = visits.filter(b => b.session_date >= from && (b.session_date < today || (b.session_date === today && ['arrived', 'completed'].includes(b.status)))).pop();
  if (done) return `<div class="card" style="border:2px solid var(--brand)"><h2>You can apply to exit now</h2>
    <p>Your interlock data was read on <b>${shortDate(done.session_date)}</b>. <b>Apply to NZTA within 24 hours of that visit if you can.</b> NZTA allows 48 hours, so the latest is the end of <b>${shortDate(addDays(done.session_date, EXIT_DAYS))}</b>. After that you need another reading.</p>
    <a class="btn brand" href="${EXIT_FORM}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Open the NZTA exit form</a>
    <p class="muted" style="margin-top:8px">Once NZTA approves it, come back here and book your removal. If they decline it, their email gives the date of your last violation.</p>
    <button class="btn ghost" data-heard="me">NZTA declined it? Enter your last violation date</button></div>`;
  // had the reading visit, the 48 hours have passed, and we have not heard how it went
  const waiting = visits.some(b => b.session_date >= d.exitEligible && b.session_date < from && b.status === 'completed');
  const heard = !waiting ? '' : `<div class="card" style="border:2px solid var(--warn)"><h2>Heard back from NZTA?</h2>
    <p>If you applied to exit after your last visit, tell us how it went so your dates here stay right.</p>
    <button class="btn brand" data-heard="more">Approved: book my removal</button>
    <button class="btn ghost" data-heard="me">Declined: enter my last violation date</button>
    <p class="muted" style="margin-top:8px">The date of your last violation is in the email NZTA sent you. You can apply again 6 months after it.</p></div>`;
  const next = visits.find(b => b.session_date >= today);
  if (next) return heard + `<div class="card" style="border:2px solid var(--brand)"><h2>You are eligible to apply to exit</h2>
    <p>You are booked for <b>${shortDate(next.session_date)}</b>. After that visit the link to the NZTA exit form shows here and we email it to you. Apply within 24 hours of the visit (NZTA allows 48).</p></div>`;
  const due = w && today >= w.opens;
  return heard + `<div class="card" style="border:2px solid var(--brand)"><h2>${waiting ? 'Applying to exit again' : 'You are eligible to apply to exit'}</h2>
    <p><b>Book an appointment first.</b> NZTA needs a reading of your interlock data taken no more than 48 hours before you apply. The link to the NZTA form shows here once you have had your visit.</p>
    ${due ? '<p class="muted">Your monthly service is due, and it includes the data reading.</p><button class="btn brand" data-exit="service">Book my monthly service</button><button class="btn ghost" data-exit="data">Data reading only, $60</button>'
          : '<p class="muted">Not due a service yet? A data reading is all you need.</p><button class="btn brand" data-exit="data">Book a data reading, $60</button><button class="btn ghost" data-exit="service">Book my monthly service instead</button>'}</div>`;
}

    <div class="card"><h2>Where and when</h2><div class="chips"><button class="chip" aria-pressed="${S.loc==='all'}" data-loc="all">All</button>${locs.map(l => `<button class="chip" aria-pressed="${S.loc===l}" data-loc="${l}">${esc(LOC(l).name)}</button>`).join('')}</div>
      <p class="muted">Each day has one time: the next free spot.</p><div id="rows">${rows.map((r, i) => { const s = svcFor(r.session_date);
        return `<div class="slot"><span><b>${shortDate(r.session_date)} · <span class="t">${fmtTime(r.offered_min)}</span></b><span class="muted">${esc(LOC(r.location_id).name)}${s ? ' · ' + money(s.price) : ''}${(r.notes||[]).length ? ' · ' + esc(r.notes.join('; ')) : ''}</span>${r.request ? `<span class="muted" style="color:var(--warn);display:block">${r.request_only ? 'This day is by request only. Matt confirms it.' : 'Online bookings have closed for this session. You can request it.'}</span>` : ''}</span>
          <button class="btn sm${r.request ? ' ghost' : ''}" data-pick="${i}">${r.request ? 'Request' : 'Book'}</button></div>`; }).join('') || `<p>No times free in the next 3 weeks. Text Matt on ${MATT}.</p>`}</div></div><div id="conf"></div>`;
  document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => { S.svc = b.dataset.svc; viewBook(); });
  document.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { S.loc = b.dataset.loc; viewBook(); });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => confirmBook(rows[+b.dataset.pick], svcFor));
  wireVeh();
  wireCancel();
}

function confirmBook(r, svcFor) {
  const s = svcFor(r.session_date), l = LOC(r.location_id);
  if (!s) return toast('That service is not available to you online. Text Matt on ' + MATT, true);
  const adv = S.svc === 'service' ? applyDateAdvice(eng(), r.session_date, S.avail.map(x => ({ session: { date: x.session_date }, offered: x.offered_min, row: x }))) : null;
  const cv = multi() ? vById(S.veh) : null, vd = cv ? { vehicle_id: cv.id } : {};
  const w = s.id === 'data' ? serviceWindow(engV(cv), r.session_date, servicedDates(multi() ? vBookings(cv) : S.bookings, services)) : null, inWin = w && r.session_date >= w.opens && r.session_date <= w.closes;
  const dataNote = s.id !== 'data' ? '' : `<div class="note"><b>Are you sure this is what you want?</b> This is a data reading only. It is not your monthly service, and you still need your service when it is due.
    ${inWin && !live('service') ? `<br><b>Your monthly service is due around ${shortDate(w.due)}</b>, and a full service includes the data reading. <button class="btn brand" id="fullSvc">Book my monthly service instead</button>` : ''}</div>`;
  if (r.request) {
    $('conf').innerHTML = `<div class="card" id="confCard" style="border:2px solid var(--warn)"><h2>${r.request_only ? 'This day is by request only' : 'Bookings for this session have closed'}</h2>
      <p>${r.request_only ? 'Did you want to request this time? Matt will confirm it, or offer another time.' : 'Online bookings close 2 hours before. Did you want to request this time instead?'}</p>
      <div class="big">${longDate(r.session_date)}</div><div class="big t" style="color:var(--brand)">${fmtTime(r.offered_min)}</div>
      <p><b>${esc(l.name)}</b><br>${mapLink(l)}</p><p>${esc(s.name)} · <b>${money(s.price)}</b> <span class="muted">to pay on the day</span></p>
      <div class="note"><b>A request is not a booking.</b> Matt gets it straight away. Please do not come until he confirms it. We will email you either way.</div>
      <button class="btn brand" id="yes">Send request</button><button class="btn ghost" id="no">Back</button></div>`;
    $('confCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('no').onclick = () => { $('conf').innerHTML = ''; };
    $('yes').onclick = async () => {
      $('yes').disabled = true; $('yes').textContent = 'Sending…';
      const { data, error } = await db.rpc('book_next_slot', { p_location: r.location_id, p_date: r.session_date, p_service: s.id, p_expected_min: r.offered_min, p_details: { ...vd, lateRequest: true } });
      if (error) { await reload(); return toast(errMsg(error), true); }
      S.tab = 'home'; reload(data && data.status === 'confirmed' ? 'Booked. See you there.' : 'Request sent. It is not confirmed until Matt confirms it.');
    };
    return;
  }
  $('conf').innerHTML = `<div class="card" id="confCard"><h2>Confirm</h2><div class="big">${longDate(r.session_date)}</div><div class="big t" style="color:var(--brand)">${fmtTime(r.offered_min)}</div>
    <p><b>${esc(l.name)}</b><br>${mapLink(l)}</p><p>${esc(s.name)} · <b>${money(s.price)}</b> <span class="muted">to pay on the day</span></p>
    ${dataNote}${adv ? `<div class="note"><b>Heads up.</b> ${esc(adv.message.replace(adv.applyDate, yDate(adv.applyDate)))}
      ${adv.suggestion ? `<button class="btn brand" id="later">Book ${shortDate(adv.suggestion.row.session_date)} at ${esc(LOC(adv.suggestion.row.location_id).name)} instead</button>` : '<p>No later days are open yet. They open 3 weeks ahead.</p>'}</div>` : ''}
    <button class="btn" id="yes">${adv ? 'Book this day anyway' : s.id === 'data' ? 'Yes, book the data reading' : 'Confirm booking'}</button><button class="btn ghost" id="no">Back</button></div>`;
  $('confCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('no').onclick = () => { $('conf').innerHTML = ''; };
  if ($('later')) $('later').onclick = () => confirmBook(adv.suggestion.row, svcFor);
  if ($('fullSvc')) $('fullSvc').onclick = () => { S.svc = 'service'; viewBook(); toast('Pick a day for your monthly service'); };
  $('yes').onclick = async () => {
    $('yes').disabled = true; $('yes').textContent = 'Booking…';
    const { error } = await db.rpc('book_next_slot', { p_location: r.location_id, p_date: r.session_date, p_service: s.id, p_expected_min: r.offered_min, p_details: vd });
    if (error) { await reload(); return toast(errMsg(error), true); }
    S.tab = 'home'; reload('Booked. See you there.');
  };
}

// ---------- removal + changeover ----------
function viewMore() {
  const rm = live('removal'), today = nzToday(), e = eng(), d = customerDates(e, today), req = S.requests.find(x => x.status === 'requested' || x.status === 'accepted');
  const early = d.exitEligible && today < d.exitEligible;
  $('view').innerHTML = `<h1>Removal</h1>
    ${rm ? bookingCard(rm) : `<div class="card"><h2>Request a removal</h2>
      <p>${early ? `Your apply date is <b>${yDate(d.exitEligible)}</b>. Before then the interlock can only come out as a <b>temporary removal</b>, and you need approval from NZTA first.`
                 : 'You need your <b>zero alcohol licence</b> before the interlock can come out. Take a photo of it here.'}</p>
      <p class="muted">Removals are done after servicing, so the time is approximate until Matt approves it. It is locked in on the morning.</p>
      <div class="chips"><button class="chip" aria-pressed="${S.loc==='all'}" data-rloc="all">All</button>${[...new Set(S.rAvail.map(r => r.location_id))].map(l => `<button class="chip" aria-pressed="${S.loc===l}" data-rloc="${l}">${esc(LOC(l).name)}</button>`).join('')}</div>
      <div id="rrows">${S.rAvail.map((r, i) => { if (S.loc !== 'all' && r.location_id !== S.loc) return ''; const s = removalOn(r.session_date);
        return `<div class="slot"><span><b>${shortDate(r.session_date)} · <span class="t">about ${fmtTime(r.offered_min)}</span></b><span class="muted">${esc(LOC(r.location_id).name)}${s ? ' · ' + money(s.price) : ''}</span></span>
        <button class="btn sm" data-rpick="${i}">Choose</button></div>`; }).join('') || `<p>No removal spots in the next 3 weeks. Text Matt on ${MATT}.</p>`}</div></div><div id="rconf"></div>`}
    <h1>Changeover</h1>
    ${req ? `<div class="card"><h2>Changeover requested</h2><p>${esc(req.vehicle_year)} ${esc(req.vehicle_make)} ${esc(req.vehicle_model)} · ${esc(req.vehicle_rego)}</p><p><span class="pill warn">${req.status === 'accepted' ? 'Accepted — Matt will confirm a time' : 'Waiting for Matt'}</span></p></div>`
      : `<div class="card"><h2>Move it to another vehicle</h2><p class="muted">Matt comes to you for this. Tell him about the vehicle and when suits, and he will be in touch with a time. $290 standard, $350 for push-button start, hybrid, EV or European.</p>
      <form id="chF"><div class="facts"><div><label class="f" for="vRego">Plate</label><input id="vRego" maxlength="6" autocapitalize="characters"></div><div><label class="f" for="vYear">Year</label><input id="vYear" inputmode="numeric" maxlength="4"></div>
        <div><label class="f" for="vMake">Make</label><input id="vMake" placeholder="Toyota"></div><div><label class="f" for="vModel">Model</label><input id="vModel" placeholder="Hilux"></div>
        <div><label class="f" for="vStart">Start</label><select id="vStart"><option value="">Choose…</option><option value="key">Key</option><option value="push">Push button</option></select></div>
        <div><label class="f" for="vFuel">Fuel</label><select id="vFuel"><option value="">Choose…</option><option value="petrol">Petrol</option><option value="diesel">Diesel</option><option value="hybrid">Hybrid</option><option value="ev">Electric</option></select></div></div>
        <label class="f" for="vAddr">Where will the vehicle be?</label><input id="vAddr" autocomplete="street-address" placeholder="Address">
        <label class="f" for="vWhen">What day and time suits?</label><input id="vWhen" placeholder="e.g. Friday morning">
        <div id="chErr" class="note bad" hidden></div><button class="btn brand">Send request</button></form></div>`}`;
  wireCancel();
  document.querySelectorAll('[data-rpick]').forEach(b => b.onclick = () => confirmRemoval(S.rAvail[+b.dataset.rpick]));
  document.querySelectorAll('[data-rloc]').forEach(b => b.onclick = () => { S.loc = b.dataset.rloc; viewMore(); });
  if ($('chF')) $('chF').onsubmit = async ev => {
    ev.preventDefault();
    const v = { rego: $('vRego').value, year: $('vYear').value, make: $('vMake').value, model: $('vModel').value, startType: $('vStart').value, fuel: $('vFuel').value };
    const r = changeoverRequest(eng(), v, { today, siteAddress: $('vAddr').value, approxTime: $('vWhen').value });
    if (!r.ok) { $('chErr').textContent = Object.values(r.errors).join('. '); $('chErr').hidden = false; return; }
    const q = r.request;
    const { error } = await db.rpc('request_changeover', { p: { ...q.vehicle, likelyInstall: q.likelyInstall, siteAddress: q.siteAddress, approxTime: q.approxTime, quote: q.quote } });
    if (error) return toast(errMsg(error), true);
    reload(`Request sent. About ${money(q.quote)}. Matt will be in touch.`);
  };
}

function confirmRemoval(r) {
  const need = removalRequirements(eng(), r.session_date), s = removalOn(r.session_date), l = LOC(r.location_id);
  $('rconf').innerHTML = `<div class="card" id="rc"><h2>${need.temporary ? 'Temporary removal' : 'Removal'}</h2><div class="big">${longDate(r.session_date)}</div>
    <div class="big t" style="color:var(--brand)">about ${fmtTime(r.offered_min)}</div><p><b>${esc(l.name)}</b><br>${mapLink(l)}</p><p><b>${money(s ? s.price : 110)}</b></p>
    ${need.temporary ? `<label class="f" for="rRef">NZTA temporary removal approval number</label><input id="rRef" autocomplete="off">`
                     : `<label class="f" for="rPhoto">Photo of your zero alcohol licence</label><input id="rPhoto" type="file" accept="image/*">`}
    <div id="rErr" class="note bad" hidden></div><button class="btn" id="rYes">Send removal request</button><button class="btn ghost" id="rNo">Back</button></div>`;
  $('rc').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('rNo').onclick = () => { $('rconf').innerHTML = ''; };
  const fail = m => { $('rErr').textContent = m; $('rErr').hidden = false; $('rYes').disabled = false; $('rYes').textContent = 'Send removal request'; };
  $('rYes').onclick = async () => {
    $('rErr').hidden = true; $('rYes').disabled = true; const details = {};
    try {
      if (need.temporary) { const ref = $('rRef').value.trim(); if (!ref) return fail('Enter the approval number NZTA gave you'); details.nztaApprovalRef = ref; }
      else {
        const f = $('rPhoto').files[0]; if (!f) return fail('Add a photo of your zero alcohol licence');
        $('rYes').textContent = 'Uploading photo…';
        const path = `${S.user.id}/${Date.now()}.jpg`;
        const { error } = await withTimeout(db.storage.from('licences').upload(path, await shrink(f), { contentType: 'image/jpeg' }), 60000, 'Uploading the photo');
        if (error) throw error; details.zeroAlcoholLicencePhoto = path;
      }
      $('rYes').textContent = 'Sending…';
      const { error } = await db.rpc('book_next_slot', { p_location: r.location_id, p_date: r.session_date, p_service: 'rem', p_details: details });
      if (error) throw error;
      reload('Request sent. Matt will approve it.');
    } catch (e) { fail(errMsg(e)); }
  };
}
// phone photos are huge: scale to 1600px JPEG before upload
async function shrink(file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  } catch (e) { return file; }
}

function priceReqNote() {
  const r = S.me.price_request; if (!r) return '';
  const asked = [r.wants_subsidy ? 'subsidy' : null, r.no_theft_protection ? 'no theft protection' : null].filter(Boolean).join(' and ') || 'a price change';
  if (r.status === 'requested') return `<div class="note"><b>Request sent.</b> You asked for ${asked}. Waiting for Matt to confirm. Until then the price above applies.</div>`;
  if (Date.now() - new Date(r.decided_at || r.created_at) > 30 * 86400000) return '';
  return r.status === 'approved' ? `<div class="note ok"><b>Approved.</b> Matt confirmed your request for ${asked}.</div>`
    : `<div class="note bad"><b>Not approved.</b> Matt could not confirm your request for ${asked}. Text him on ${MATT} if that seems wrong.</div>`;
}
function viewMe() {
  const d = customerDates(eng(), nzToday());
  $('view').innerHTML = `<h1>${esc([S.me.first_name, S.me.last_name].filter(Boolean).join(' '))}</h1>
    <div class="card"><div class="facts"><div class="fact"><div class="k">Mobile</div><div class="v">${esc(S.me.mobile || '—')}</div></div><div class="fact"><div class="k">Vehicle</div><div class="v">${esc(S.me.vehicle || '—')}</div></div></div>
      <p class="muted">Something wrong? Text Matt on <a href="sms:${MATT.replace(/ /g,'')}">${MATT}</a>.</p></div>
    <div class="card" id="prCard"><h2>Your price</h2>${(() => { const m = monthlyOn(nzToday()); return m ? `<div class="slot"><span>${esc(m.name)}</span><b class="t">${money(m.price)}</b></div>` : ''; })()}
      ${priceReqNote()}
      ${S.me.price_request?.status === 'requested' ? '' : `<p class="muted">If your price should be different, tick what applies. Matt checks it and confirms. Your price stays the same until he does.</p>
      <form id="prF">${d.subsidyActive ? '' : '<label class="chk"><input type="checkbox" id="prSub"> I have the subsidy</label>'}
        ${S.me.theft_protection === false ? '' : '<label class="chk"><input type="checkbox" id="prTp"> I don\'t have theft protection</label>'}
        <label class="f" for="prNote">Anything Matt should know (optional)</label><input id="prNote" maxlength="300">
        <div id="prErr" class="note bad" hidden></div><button class="btn brand">Send request</button></form>`}</div>
    <div class="card"><h2>Apply date</h2><p>Currently <b>${yDate(d.exitEligible)}</b>${S.me.last_violation_date ? ` (6 months after your last violation on ${yDate(S.me.last_violation_date)})` : S.me.apply_date ? ' (the date NZTA gave you)' : ' (12 months after install)'}.</p>
      <p class="muted">If you applied and NZTA declined it, their email gives the <b>date of your last violation</b>. Enter that date here. You can apply again 6 months after it, and we work that out for you.</p>
      <form id="lvF"><label class="f" for="lv">Date of last violation (from the NZTA email)</label><input id="lv" type="date" max="${nzToday()}" value="${esc(S.me.last_violation_date || '')}"><div id="lvOut" class="note" hidden></div><div id="lvErr" class="note bad" hidden></div><button class="btn brand">Save</button></form>
      <details style="margin-top:10px"><summary class="muted">NZTA gave me an actual date to apply instead</summary>
      <form id="adF"><label class="f" for="ad">Date you can next apply</label><input id="ad" type="date" value="${esc(S.me.apply_date || '')}"><div id="adErr" class="note bad" hidden></div><button class="btn">Save date</button></form></details></div>
    <div class="card"><h2>Reminders</h2><p class="muted">We email you about your bookings and when your service is due.</p>
      <label class="chk"><input type="checkbox" id="smsOn" ${S.me.sms_reminders ? 'checked' : ''}> Also text me on the morning of each booking</label>
      ${S.me.email ? '' : '<p class="muted">We have no email for you, so we text you anyway.</p>'}</div>
    ${signedDocsCard()}
    ${homeScreenCard(false)}
    <div class="card"><button class="btn ghost" id="out" style="margin-top:0">Sign out</button><p class="muted" style="text-align:center"><a href="../privacy/">Privacy policy</a></p></div>
    <p class="muted" style="text-align:center;font-size:.75rem">build 2026-11-18 22:02 UTC</p>`;
  $('out').onclick = signOut;
  wireHomeScreen(); wireSignedDocs();
  $('smsOn').onchange = async () => {
    const on = $('smsOn').checked; $('smsOn').disabled = true;
    const { error } = await db.rpc('set_sms_reminders', { p_on: on });
    $('smsOn').disabled = false;
    if (error) { $('smsOn').checked = !on; return toast(errMsg(error), true); }
    S.me.sms_reminders = on; toast(on ? 'We will text you on the morning' : 'Morning texts off');
  };
  if ($('prF')) $('prF').onsubmit = async ev => {
    ev.preventDefault();
    const p = { wantsSubsidy: !!$('prSub')?.checked, noTheftProtection: !!$('prTp')?.checked, note: $('prNote').value.trim() };
    if (!p.wantsSubsidy && !p.noTheftProtection && p.note.length < 3) { $('prErr').textContent = 'Tick what applies, or tell Matt what should change.'; $('prErr').hidden = false; return; }
    const { error } = await db.rpc('request_price', { p });
    if (error) return toast(errMsg(error), true);
    reload('Request sent. Matt will confirm it.');
  };
  const lvDate = () => { const v = $('lv').value; if (!v) return null; const six = addMonths(v, 6), std = S.me.install_date ? addMonths(S.me.install_date, 12) : six; return six > std ? six : std; };
  $('lv').oninput = () => { const x = lvDate(); $('lvOut').hidden = !x; if (x) $('lvOut').innerHTML = `You can apply again from <b>${yDate(x)}</b>.`; };
  $('lvF').onsubmit = async ev => {
    ev.preventDefault();
    const v = $('lv').value, say = m => { $('lvErr').textContent = m; $('lvErr').hidden = false; };
    if (!v) return say('Enter the date of your last violation');
    if (v > nzToday()) return say('That date is in the future. Check the email from NZTA');
    const { error } = await db.rpc('set_last_violation', { p_date: v });
    if (error) return say(errMsg(error));
    reload('Saved. You can apply again from ' + yDate(lvDate()));
  };
  $('adF').onsubmit = async ev => {
    ev.preventDefault();
    const r = setApplyDate(eng(), $('ad').value, { today: nzToday() });
    if (r.error) { $('adErr').textContent = r.error; $('adErr').hidden = false; return; }
    const { error } = await db.rpc('set_apply_date', { new_date: $('ad').value });
    if (error) return toast(errMsg(error), true);
    reload('Apply date saved');
  };
}

db.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !S.me && !S.starting && !new URLSearchParams(location.search).get('pay') && !new URLSearchParams(location.search).has('new') && !new URLSearchParams(location.search).has('help')) { S.starting = true; setTimeout(() => start().finally(() => S.starting = false), 0); } });
start();
</script>
