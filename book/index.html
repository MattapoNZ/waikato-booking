<body>
<div id="app"><div class="card muted">Loading…</div></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Waikato Interlocks booking engine — sequential slot logic.
// No dependencies. All dates are NZ-local "YYYY-MM-DD" strings and all times are
// minutes after midnight, because every location is in one time zone.
//
// Core rule (matches how Timely is set up today with "minimise gaps"):
//   a customer is only ever offered ONE time per session — the earliest unbooked slot.
//   Cambridge Tue 9:20–10:10 with 5-min slots: first person sees 9:20, next sees 9:25 …
//   If someone cancels 9:30, the next customer is offered 9:30 (gap gets filled first).

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---------- date helpers (pure, timezone-free) ----------
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function fmtDate(dt) {
  return dt.toISOString().slice(0, 10);
}
function addDays(s, n) {
  const dt = parseDate(s);
  dt.setUTCDate(dt.getUTCDate() + n);
  return fmtDate(dt);
}
function weekday(s) {
  return parseDate(s).getUTCDay();
}
function hm(str) {
  // "9:20" -> 560
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, '0')}${ap}`;
}
// Which occurrence of its weekday a date is in its month: 1..5 ; and whether it is the last.
function nthOfMonth(s) {
  const d = parseDate(s).getUTCDate();
  const n = Math.ceil(d / 7);
  const isLast = parseDate(addDays(s, 7)).getUTCMonth() !== parseDate(s).getUTCMonth();
  return { n, isLast };
}

// ---------- recurrence ----------
// rule shapes:
//   { type: 'weekly',  weekdays: [2,4] }                 every Tue + Thu
//   { type: 'weekly',  weekdays: [2], everyNWeeks: 2, anchor: '2026-11-03' }  fortnightly
//   { type: 'monthly', weekday: 3, nth: 1 }               first Wednesday
//   { type: 'monthly', weekday: 5, nth: 'last' }          last Friday
//   { type: 'once',    date: '2026-12-23' }               one-off session
function ruleMatches(rule, date) {
  const wd = weekday(date);
  switch (rule.type) {
    case 'weekly': {
      if (!rule.weekdays.includes(wd)) return false;
      if (!rule.everyNWeeks || rule.everyNWeeks === 1) return true;
      const diffDays = Math.round((parseDate(date) - parseDate(rule.anchor)) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      return diffDays >= 0 && weeks % rule.everyNWeeks === 0;
    }
    case 'monthly': {
      if (wd !== rule.weekday) return false;
      const { n, isLast } = nthOfMonth(date);
      return rule.nth === 'last' ? isLast : n === rule.nth;
    }
    case 'once':
      return rule.date === date;
    default:
      return false;
  }
}

// ---------- sessions ----------
// A "schedule" is a standing pattern for a location, e.g. Cambridge Tue 9:20–10:10.
// schedule: { id, locationId, rule, start:'9:20', end:'10:10', slotMins:5, validFrom?, validTo? }
// exception: { locationId, date, kind:'closed' }                         — skip that day
//            { locationId, date, kind:'override', start, end, note? }     — different hours that day
//            { locationId, date, kind:'moved', toLocationId?, note }      — e.g. changed meeting point
function sessionsForRange({ schedules, exceptions = [], locations = [] }, fromDate, toDate) {
  const out = [];
  for (let d = fromDate; d <= toDate; d = addDays(d, 1)) {
    for (const s of schedules) {
      if (s.validFrom && d < s.validFrom) continue;
      if (s.validTo && d > s.validTo) continue;
      if (!ruleMatches(s.rule, d)) continue;
      const loc = locations.find(l => l.id === s.locationId);
      if (loc && loc.active === false) continue;
      const exs = exceptions.filter(e => e.locationId === s.locationId && e.date === d);
      if (exs.some(e => e.kind === 'closed')) continue;
      const ov = exs.find(e => e.kind === 'override');
      const start = hm(ov ? ov.start : s.start);
      const end = hm(ov ? ov.end : s.end);
      const notes = exs.filter(e => e.note).map(e => e.note);
      out.push({
        id: `${s.locationId}@${d}@${start}`,
        scheduleId: s.id,
        locationId: s.locationId,
        date: d,
        start,
        end,
        slotMins: s.slotMins || 5,
        // Removals are floating placeholders (see removalEstimates): up to removalSlots per session
        removalSlots: s.removalSlots ?? 3,
        removalMins: s.removalMins ?? 15,
        notes,
      });
    }
  }
  return out.sort((a, b) => (a.date + String(a.start).padStart(4, '0')).localeCompare(b.date + String(b.start).padStart(4, '0')));
}

// All slot start times in a session that fit a service of `durationMins`.
function slotTimes(session, durationMins = session.slotMins) {
  const times = [];
  for (let t = session.start; t + durationMins <= session.end; t += session.slotMins) times.push(t);
  return times;
}

// Is [t, t+dur) free given existing bookings (each {start, duration, status})?
function isFree(t, dur, bookings) {
  return !bookings.some(b => b.status !== 'cancelled' && t < b.start + b.duration && b.start < t + dur);
}

function leadTimeOk(date, t, now, cutoffMins) {
  const dayDiff = Math.round((parseDate(date) - parseDate(now.date)) / 86400000);
  const minsUntil = dayDiff * 1440 + t - now.minutes;
  return minsUntil >= cutoffMins;
}

// ---------- removals: floating placeholders ----------
// A removal does NOT hold a time. It is a placeholder that sits at the first free gap in the
// session and slides later whenever a service or violation reset books that time:
//   removal requested when 11:30 is free -> shows "about 11:30"; someone books a service at 11:30
//   -> the removal now shows "about 11:35", and so on.
// It only becomes a solid, held time once Matt has approved it AND times are locked on the
// morning of the session. Until then services always win.
// booking fields used: { id, start, duration, status, kind, timeLocked, approvedAt, createdAt }
//   timeLocked === false  -> floating removal;  anything else -> fixed (holds its time)
const isFloating = b => b.kind === 'removal' && b.timeLocked === false && b.status !== 'cancelled';
// timeLocked === false on anything else (e.g. a walk-in sale) means it is on the sheet but holds no slot
const isFixed = b => b.status !== 'cancelled' && b.timeLocked !== false;

// Estimated time for every floating removal in this session: Map(bookingId -> minutes).
// Approved ones are placed first, then in the order they were requested.
function removalEstimates(session, bookings, { onlyApproved = false, extra = 0 } = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const fixed = sess.filter(isFixed).map(b => ({ start: b.start, duration: b.duration, status: 'confirmed' }));
  const floaters = sess.filter(isFloating).filter(b => !onlyApproved || b.approvedAt)
    .map((b, i) => ({ b, i }))
    .sort((x, y) => (!x.b.approvedAt - !y.b.approvedAt) || String(x.b.createdAt || '').localeCompare(String(y.b.createdAt || '')) || x.i - y.i)
    .map(x => x.b);
  const out = new Map();
  const place = () => {
    let t = session.start;
    while (!isFree(t, session.removalMins, fixed)) t += session.slotMins;
    fixed.push({ start: t, duration: session.removalMins, status: 'confirmed' });
    return t;
  };
  for (const b of floaters) out.set(b.id, place());
  for (let i = 0; i < extra; i++) out.set(`new${i}`, place());   // where the NEXT request would sit
  return out;
}

// Morning of the session: approved removals take a solid time and now hold it. Unapproved ones stay floating.
function lockRemovals(session, bookings) {
  const est = removalEstimates(session, bookings, { onlyApproved: true });
  return bookings.map(b => est.has(b.id) ? { ...b, start: est.get(b.id), timeLocked: true, status: 'confirmed' } : b);
}

// The ONE time offered to a customer for this session, or null if full.
// Services / resets: earliest 5-min slot not held by a service or a LOCKED removal (floating removals are ignored).
// Removals: an approximate time only — null once the session has its limit of removals (default 3).
// opts.now = { date, minutes } (NZ local), opts.cutoffMins = min lead time (Timely: 3 hours)
function nextOfferedSlot(session, bookings, durationMins = session.slotMins, opts = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const cutoff = opts.cutoffMins ?? 180;
  if (opts.kind === 'removal') {
    if (sess.filter(b => b.kind === 'removal' && b.status !== 'cancelled').length >= session.removalSlots) return null;
    if (opts.now && !leadTimeOk(session.date, session.start, opts.now, cutoff)) return null;
    return removalEstimates(session, bookings, { extra: 1 }).get('new0');
  }
  const fixed = sess.filter(isFixed);
  for (const t of slotTimes(session, durationMins)) {
    if (!isFree(t, durationMins, fixed)) continue;
    if (opts.now && !leadTimeOk(session.date, t, opts.now, cutoff)) continue;
    return t;
  }
  return null;
}

// What the customer app shows: one row per upcoming session with its single offered time.
// horizonDays: Timely is currently set to 3 weeks ahead.
function customerAvailability(data, bookings, { fromDate, horizonDays = 21, durationMins = 5, kind = 'service', now, cutoffMins = 180, locationId } = {}) {
  const toDate = addDays(fromDate, horizonDays);
  return sessionsForRange(data, fromDate, toDate)
    .filter(s => !locationId || s.locationId === locationId)
    .map(s => ({ session: s, offered: nextOfferedSlot(s, bookings, durationMins, { now, cutoffMins, kind }) }))
    .filter(r => r.offered !== null);
}

// Create a booking — re-checks the slot so two people tapping at once can't both get 9:25.
// (In the real backend this is enforced by a unique index on (location, date, start) inside a transaction.)
// Services and resets are auto-confirmed and hold their time. Removals are floating placeholders:
// pencilled, no held time, until Matt approves and times are locked on the morning.
function book(session, bookings, { customerId, serviceId, kind = 'service', durationMins = 5, requestedStart, now, cutoffMins = 180, customer, details = {} }) {
  if (kind === 'removal' && customer) {
    const req = removalRequirements(customer, session.date);
    if (req.temporary && !String(details.nztaApprovalRef || '').trim()) {
      return { ok: false, reason: 'This is before your apply date, so NZTA temporary removal approval is needed', needs: req.needs };
    }
    if (!req.temporary && !details.zeroAlcoholLicencePhoto) {
      return { ok: false, reason: 'Add a photo of your zero alcohol licence to request a removal', needs: req.needs };
    }
    if (req.temporary) details = { ...details, temporary: true };
  }
  const offered = nextOfferedSlot(session, bookings, durationMins, { now, cutoffMins, kind });
  if (offered === null) return { ok: false, reason: kind === 'removal' ? 'No removal spots left that day' : 'Session full' };
  if (kind !== 'removal' && requestedStart !== undefined && requestedStart !== offered) {
    return { ok: false, reason: 'That time was just taken', offered };
  }
  const booking = {
    id: `bk_${session.id}_${kind}_${kind === 'removal' ? 'float' : offered}_${customerId}`,
    sessionId: session.id,
    locationId: session.locationId,
    date: session.date,
    start: offered,
    duration: kind === 'removal' ? session.removalMins : durationMins,
    customerId,
    serviceId,
    kind,
    status: kind === 'removal' ? 'pencilled' : 'confirmed',
    timeLocked: kind !== 'removal',   // removals float until approved + locked
    approvedAt: null,
    details,
  };
  return { ok: true, booking };
}

// ---------- customer rules ----------
// Customer: { installDate, subsidised, subsidyStart?, subsidyMonths=15, theftProtection, blockedServiceIds? }
function addMonths(s, n) {
  const dt = parseDate(s);
  const day = dt.getUTCDate();
  dt.setUTCDate(1);
  dt.setUTCMonth(dt.getUTCMonth() + n);
  const lastDay = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(day, lastDay));
  return fmtDate(dt);
}

// Subsidy runs 15 months from install, or from the later date they obtained it (subsidyStart).
function customerDates(c, today) {
  const subStart = c.subsidised ? (c.subsidyStart && c.subsidyStart > c.installDate ? c.subsidyStart : c.installDate) : null;
  const subsidyEnds = subStart ? addMonths(subStart, c.subsidyMonths ?? 15) : null;
  const standardExit = c.installDate ? addMonths(c.installDate, 12) : null;
  return {
    // Apply-for-removal date: 12 months after install, unless NZTA gave a new date after a denial
    // (the customer can enter that themselves — see setApplyDate).
    exitEligible: c.applyDate || standardExit,
    standardExit,
    applyDateSource: c.applyDate ? (c.applyDateSetBy || 'customer') : 'install',
    subsidyStart: subStart,
    subsidyEnds,
    subsidyActive: !!subsidyEnds && (!today || today < subsidyEnds),
  };
}

// Monthly service window = install day-of-month each month, ±7 days.
function serviceWindow(c, onOrAfter) {
  if (!c.installDate) return null;
  for (let i = 1; i < 60; i++) {
    const due = addMonths(c.installDate, i);
    if (addDays(due, 7) >= onOrAfter) return { due, opens: addDays(due, -7), closes: addDays(due, 7) };
  }
  return null;
}

// Exactly what this customer is allowed to book, worked out from their profile:
//  - ONE monthly service: subsidised or full price (by subsidy dates) × with/without theft protection
//  - both violation resets
//  - removal: from the apply date as normal; before it only as a temporary removal with NZTA approval
//    (free while still subsidised)
//  - changeover to another vehicle (request only, needs vehicle details)
//  - minus anything Matt has switched off for them (blockedServiceIds)
function allowedServices(c, services, today) {
  const d = customerDates(c, today);
  const tp = c.theftProtection !== false;
  const out = [];
  const monthly = services.find(s => s.group === 'service' && !!s.subsidised === d.subsidyActive && !!s.theftProtection === tp);
  if (monthly) out.push(monthly);
  out.push(...services.filter(s => s.group === 'violation'));
  const rem = services.find(s => s.group === 'removal');
  if (rem && c.installDate) {
    const early = !!d.exitEligible && today < d.exitEligible;
    out.push({ ...rem, price: d.subsidyActive ? 0 : rem.price,
      note: [d.subsidyActive ? 'Free while subsidised' : null, early ? 'Before your apply date — needs NZTA temporary removal approval' : null].filter(Boolean).join(' · ') || null });
  }
  out.push(...services.filter(s => s.group === 'changeover'));
  return out.filter(s => s.onlineBookable && !(c.blockedServiceIds || []).includes(s.id));
}

// Customer enters the new apply date NZTA gave them after a denied application.
// Returns the updated customer, or { error } if the date doesn't make sense.
function setApplyDate(c, newDate, { today, setBy = 'customer' } = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate || '') || isNaN(parseDate(newDate))) return { error: 'Enter the date NZTA gave you' };
  if (c.installDate && newDate <= c.installDate) return { error: 'That date is before your install date' };
  if (today && newDate < addDays(today, -365)) return { error: 'That date is more than a year ago — check the letter from NZTA' };
  return { customer: { ...c, applyDate: newDate, applyDateSetBy: setBy, applyDateSetOn: today || null } };
}

// To apply for removal NZTA needs a service AFTER the apply date.
// If a SERVICE booking falls in the last `warnDays` before the apply date, advise booking on/after it,
// and suggest the first session that day or later (from the availability list the app already has).
function applyDateAdvice(c, sessionDate, availability = [], { warnDays = 7, serviceGroup = 'service' } = {}) {
  const { exitEligible } = customerDates(c);
  if (!exitEligible) return null;
  if (!(sessionDate >= addDays(exitEligible, -warnDays) && sessionDate < exitEligible)) return null;
  const better = availability.find(r => r.session.date >= exitEligible) || null;
  const daysShort = Math.round((parseDate(exitEligible) - parseDate(sessionDate)) / 86400000);
  return {
    applyDate: exitEligible,
    daysShort,
    message: `This is ${daysShort} day${daysShort === 1 ? '' : 's'} before your apply date. To apply for removal you need a service on or after ${exitEligible}.`,
    suggestion: better, // { session, offered } or null if nothing in the booking horizon yet
  };
}

// Removal before the apply date = temporary removal: NZTA approval reference required (photo of the letter optional).
// Removal on/after the apply date = end of programme: photo of the zero alcohol licence required.
function removalRequirements(c, sessionDate) {
  const { exitEligible } = customerDates(c);
  const temporary = !!exitEligible && sessionDate < exitEligible;
  // From the apply date (end of programme) the customer shows their zero alcohol licence instead.
  return { temporary, needs: temporary ? ['nztaApprovalRef'] : ['zeroAlcoholLicencePhoto'], applyDate: exitEligible };
}

// Changeover: moving the interlock to another vehicle. A request (no slot) — Matt arranges the time.
// Vehicle details are required so he can tell if it's a standard or complex install.
const EUROPEAN = ['audi', 'bmw', 'mercedes', 'mercedes-benz', 'volkswagen', 'vw', 'volvo', 'skoda', 'peugeot', 'citroen', 'renault', 'mini', 'porsche', 'land rover', 'jaguar', 'fiat', 'alfa romeo', 'seat', 'cupra', 'opel', 'saab'];
function changeoverRequest(c, v = {}, { today, preferredLocationId = null, preferredDays = '', siteAddress = '', approxTime = '', notes = '' } = {}) {
  const errors = {};
  const rego = String(v.rego || '').toUpperCase().replace(/\s+/g, '');
  if (!/^[A-Z0-9]{1,6}$/.test(rego)) errors.rego = 'Enter the plate (up to 6 letters/numbers)';
  if (!String(v.make || '').trim()) errors.make = 'Enter the make';
  if (!String(v.model || '').trim()) errors.model = 'Enter the model';
  const year = Number(v.year), maxYear = Number((today || '2100').slice(0, 4)) + 1;
  if (!(year >= 1980 && year <= maxYear)) errors.year = 'Enter the year';
  if (!['key', 'push'].includes(v.startType)) errors.startType = 'Key or push-button start?';
  if (!['petrol', 'diesel', 'hybrid', 'ev'].includes(v.fuel)) errors.fuel = 'Choose the fuel type';
  // Changeovers are done on site: Matt comes to the vehicle, so we need where and roughly when.
  if (!String(siteAddress || '').trim()) errors.siteAddress = 'Where is the vehicle? (address)';
  if (!String(approxTime || '').trim() && !String(preferredDays || '').trim()) errors.approxTime = 'Roughly what day and time suits?';
  if (Object.keys(errors).length) return { ok: false, errors };
  const reasons = [];
  if (v.startType === 'push') reasons.push('push-button start');
  if (v.fuel === 'hybrid' || v.fuel === 'ev') reasons.push(v.fuel === 'ev' ? 'EV' : 'hybrid');
  if (EUROPEAN.includes(String(v.make).trim().toLowerCase())) reasons.push('European');
  return {
    ok: true,
    request: {
      id: `chg_${c.id}_${today || ''}_${rego}`,
      kind: 'changeover', customerId: c.id, status: 'requested', createdOn: today || null,
      vehicle: { rego, make: v.make.trim(), model: v.model.trim(), year, startType: v.startType, fuel: v.fuel },
      likelyInstall: reasons.length ? 'complex' : 'standard', complexReasons: reasons,
      // Dräger "Change vehicle": $290 standard / $350 complex, plus hourly labour if the wiring needs it
      quote: reasons.length ? 350 : 290,
      onSite: true, siteAddress: String(siteAddress).trim(), approxTime: String(approxTime).trim(),
      preferredLocationId, preferredDays, notes,
    },
  };
}

// What to charge on install day, as SEPARATE invoice lines (so Xero gets one line each):
//   1. install fee: $200 standard / $300 complex, $0 if subsidised (fee waived, still shown as a line)
//   2. first month = the customer's own monthly service item ($165, $172 with theft protection, $115 / $122 subsidised)
//   e.g. standard, full price, no theft protection: 200 + 165 = $365 (matches Timely today)
function installCharge(c, services, { complex = false, today } = {}) {
  const d = customerDates(c, today);
  const sub = c.subsidised && (d.subsidyActive || !today);
  const tp = c.theftProtection !== false;
  const fee = services.find(s => s.id === (sub ? 'inst-sub' : complex ? 'inst-cx' : 'inst'));
  const month = services.find(s => s.group === 'service' && !!s.subsidised === !!sub && !!s.theftProtection === tp);
  const lines = [
    { id: fee.id, name: fee.name, price: fee.price },
    { id: month.id, name: `${month.name} — first month`, price: month.price },
  ];
  return { lines, total: lines.reduce((a, l) => a + l.price, 0) };
}

// NZ local date + minutes -> UTC Date (handles daylight saving via the browser's time zone data)
function nzToUtc(date, mins) {
  const [y, m, d] = date.split('-').map(Number);
  const want = Date.UTC(y, m - 1, d, Math.floor(mins / 60), mins % 60);
  let t = want;
  for (let i = 0; i < 2; i++) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Pacific/Auckland', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      .formatToParts(new Date(t)).map(x => [x.type, x.value]));
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    t += want - shown;
  }
  return new Date(t);
}
const icsTime = dt => dt.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

  return { title, desc, where: l.name + (l.address ? ', ' + l.address : ''), start, end, uid: b.id + '@waikato-interlocks' };
}

      <div class="fact"><div class="k">Subsidy</div><div class="v">${d.subsidyEnds ? (d.subsidyActive ? 'Until ' : 'Ended ') + yDate(d.subsidyEnds) : 'None'}</div></div>
      <div class="fact"><div class="k">Theft protection</div><div class="v">${S.me.theft_protection ? 'Yes' : 'No'}</div></div></div>
      ${toApply === null ? '' : toApply > 0 ? `<p class="muted">${toApply} day${toApply === 1 ? '' : 's'} until you can apply to NZTA to have it removed. You need a service on or after that date.</p>`
        : '<p class="muted">You can now apply to NZTA for removal, once you have had a service on or after your apply date.</p>'}</div>`;
  if ($('goBook')) $('goBook').onclick = () => { S.tab = 'book'; render(); };
  wireCancel();
}

function viewBook() {
  const sv = live('service');
  if (sv) { $('view').innerHTML = `<h1>Book</h1><div class="note">You already have a booking. Cancel it first if you need a different day.</div>${bookingCard(sv)}`; return wireCancel(); }
  const opts = [['service', 'Monthly service'], ['vr', 'Violation reset'], ['vr-disc', 'Reset — mechanic / battery']];
  S.svc = S.svc || 'service';
  const rows = S.avail.filter(r => S.loc === 'all' || r.location_id === S.loc);
  const locs = [...new Set(S.avail.map(r => r.location_id))];
  const svcFor = date => S.svc === 'service' ? monthlyOn(date) : SVC(S.svc);
  $('view').innerHTML = `<h1>Book</h1>
    <div class="card"><h2>What for?</h2><div class="chips">${opts.map(([k, n]) => `<button class="chip" aria-pressed="${S.svc===k}" data-svc="${k}">${n}</button>`).join('')}</div>
      <p class="muted">${S.svc === 'service' ? 'Having a violation reset too? Book the service and tell Matt on the day. It is one appointment.' : 'Only book a reset by itself if you are not due a service.'}</p></div>
    <div class="card"><h2>Where and when</h2><div class="chips"><button class="chip" aria-pressed="${S.loc==='all'}" data-loc="all">All</button>${locs.map(l => `<button class="chip" aria-pressed="${S.loc===l}" data-loc="${l}">${esc(LOC(l).name)}</button>`).join('')}</div>
      <p class="muted">Each day has one time: the next free spot.</p><div id="rows">${rows.map((r, i) => { const s = svcFor(r.session_date);
        return `<div class="slot"><span><b>${shortDate(r.session_date)} · <span class="t">${fmtTime(r.offered_min)}</span></b><span class="muted">${esc(LOC(r.location_id).name)}${s ? ' · ' + money(s.price) : ''}${(r.notes||[]).length ? ' · ' + esc(r.notes.join('; ')) : ''}</span></span>
          <button class="btn sm" data-pick="${i}">Book</button></div>`; }).join('') || `<p>No times free in the next 3 weeks. Text Matt on ${MATT}.</p>`}</div></div><div id="conf"></div>`;
  document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => { S.svc = b.dataset.svc; viewBook(); });
  document.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { S.loc = b.dataset.loc; viewBook(); });
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => confirmBook(rows[+b.dataset.pick], svcFor));
}

function confirmBook(r, svcFor) {
  const s = svcFor(r.session_date), l = LOC(r.location_id);
  if (!s) return toast('That service is not available to you online. Text Matt on ' + MATT, true);
  const adv = S.svc === 'service' ? applyDateAdvice(eng(), r.session_date, S.avail.map(x => ({ session: { date: x.session_date }, offered: x.offered_min, row: x }))) : null;
  $('conf').innerHTML = `<div class="card" id="confCard"><h2>Confirm</h2><div class="big">${longDate(r.session_date)}</div><div class="big t" style="color:var(--brand)">${fmtTime(r.offered_min)}</div>
    <p><b>${esc(l.name)}</b><br>${mapLink(l)}</p><p>${esc(s.name)} · <b>${money(s.price)}</b> <span class="muted">to pay on the day</span></p>
    ${adv ? `<div class="note"><b>Heads up.</b> ${esc(adv.message.replace(adv.applyDate, yDate(adv.applyDate)))}
      ${adv.suggestion ? `<button class="btn brand" id="later">Book ${shortDate(adv.suggestion.row.session_date)} at ${esc(LOC(adv.suggestion.row.location_id).name)} instead</button>` : '<p>No later days are open yet. They open 3 weeks ahead.</p>'}</div>` : ''}
    <button class="btn" id="yes">${adv ? 'Book this day anyway' : 'Confirm booking'}</button><button class="btn ghost" id="no">Back</button></div>`;
  $('confCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('no').onclick = () => { $('conf').innerHTML = ''; };
  if ($('later')) $('later').onclick = () => confirmBook(adv.suggestion.row, svcFor);
  $('yes').onclick = async () => {
    $('yes').disabled = true; $('yes').textContent = 'Booking…';
    const { error } = await db.rpc('book_next_slot', { p_location: r.location_id, p_date: r.session_date, p_service: s.id, p_expected_min: r.offered_min, p_details: {} });
    if (error) { await reload(); return toast(errMsg(error), true); }
    S.tab = 'home'; reload('Booked. See you there.');
  };
}

// ---------- removal + changeover ----------
function viewMore() {
  const rm = live('removal'), today = nzToday(), e = eng(), d = customerDates(e, today), req = S.requests.find(x => x.status === 'requested' || x.status === 'accepted');
  const early = d.exitEligible && today < d.exitEligible;
  $('view').innerHTML = `<h1>Removal</h1>
    ${rm ? bookingCard(rm) : `<div class="card"><h2>Request a removal</h2>
      <p>${early ? `Your apply date is <b>${yDate(d.exitEligible)}</b>. Before then the interlock can only come out as a <b>temporary removal</b>, and you need approval from NZTA first.`
                 : 'You need your <b>zero alcohol licence</b> before the interlock can come out. Take a photo of it here.'}</p>
      <p class="muted">Removals are done after servicing, so the time is approximate until Matt approves it. It is locked in on the morning.</p>
      <div id="rrows">${S.rAvail.map((r, i) => { const s = removalOn(r.session_date);
        return `<div class="slot"><span><b>${shortDate(r.session_date)} · <span class="t">about ${fmtTime(r.offered_min)}</span></b><span class="muted">${esc(LOC(r.location_id).name)}${s ? ' · ' + money(s.price) : ''}</span></span>
        <button class="btn sm" data-rpick="${i}">Choose</button></div>`; }).join('') || `<p>No removal spots in the next 3 weeks. Text Matt on ${MATT}.</p>`}</div></div><div id="rconf"></div>`}
    <h1>Changeover</h1>
    ${req ? `<div class="card"><h2>Changeover requested</h2><p>${esc(req.vehicle_year)} ${esc(req.vehicle_make)} ${esc(req.vehicle_model)} · ${esc(req.vehicle_rego)}</p><p><span class="pill warn">${req.status === 'accepted' ? 'Accepted — Matt will confirm a time' : 'Waiting for Matt'}</span></p></div>`
      : `<div class="card"><h2>Move it to another vehicle</h2><p class="muted">Matt comes to you for this. Tell him about the vehicle and when suits, and he will be in touch with a time. $290 standard, $350 for push-button start, hybrid, EV or European.</p>
      <form id="chF"><div class="facts"><div><label class="f" for="vRego">Plate</label><input id="vRego" maxlength="6" autocapitalize="characters"></div><div><label class="f" for="vYear">Year</label><input id="vYear" inputmode="numeric" maxlength="4"></div>
        <div><label class="f" for="vMake">Make</label><input id="vMake" placeholder="Toyota"></div><div><label class="f" for="vModel">Model</label><input id="vModel" placeholder="Hilux"></div>
        <div><label class="f" for="vStart">Start</label><select id="vStart"><option value="">Choose…</option><option value="key">Key</option><option value="push">Push button</option></select></div>
        <div><label class="f" for="vFuel">Fuel</label><select id="vFuel"><option value="">Choose…</option><option value="petrol">Petrol</option><option value="diesel">Diesel</option><option value="hybrid">Hybrid</option><option value="ev">Electric</option></select></div></div>
        <label class="f" for="vAddr">Where will the vehicle be?</label><input id="vAddr" autocomplete="street-address" placeholder="Address">
        <label class="f" for="vWhen">What day and time suits?</label><input id="vWhen" placeholder="e.g. Friday morning">
        <div id="chErr" class="note bad" hidden></div><button class="btn brand">Send request</button></form></div>`}`;
  wireCancel();
  document.querySelectorAll('[data-rpick]').forEach(b => b.onclick = () => confirmRemoval(S.rAvail[+b.dataset.rpick]));
  if ($('chF')) $('chF').onsubmit = async ev => {
    ev.preventDefault();
    const v = { rego: $('vRego').value, year: $('vYear').value, make: $('vMake').value, model: $('vModel').value, startType: $('vStart').value, fuel: $('vFuel').value };
    const r = changeoverRequest(eng(), v, { today, siteAddress: $('vAddr').value, approxTime: $('vWhen').value });
    if (!r.ok) { $('chErr').textContent = Object.values(r.errors).join('. '); $('chErr').hidden = false; return; }
    const q = r.request;
    const { error } = await db.rpc('request_changeover', { p: { ...q.vehicle, likelyInstall: q.likelyInstall, siteAddress: q.siteAddress, approxTime: q.approxTime, quote: q.quote } });
    if (error) return toast(errMsg(error), true);
    reload(`Request sent. About ${money(q.quote)}. Matt will be in touch.`);
  };
}

function confirmRemoval(r) {
  const need = removalRequirements(eng(), r.session_date), s = removalOn(r.session_date), l = LOC(r.location_id);
  $('rconf').innerHTML = `<div class="card" id="rc"><h2>${need.temporary ? 'Temporary removal' : 'Removal'}</h2><div class="big">${longDate(r.session_date)}</div>
    <div class="big t" style="color:var(--brand)">about ${fmtTime(r.offered_min)}</div><p><b>${esc(l.name)}</b><br>${mapLink(l)}</p><p><b>${money(s ? s.price : 110)}</b></p>
    ${need.temporary ? `<label class="f" for="rRef">NZTA temporary removal approval number</label><input id="rRef" autocomplete="off">`
                     : `<label class="f" for="rPhoto">Photo of your zero alcohol licence</label><input id="rPhoto" type="file" accept="image/*">`}
    <div id="rErr" class="note bad" hidden></div><button class="btn" id="rYes">Send removal request</button><button class="btn ghost" id="rNo">Back</button></div>`;
  $('rc').scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('rNo').onclick = () => { $('rconf').innerHTML = ''; };
  const fail = m => { $('rErr').textContent = m; $('rErr').hidden = false; $('rYes').disabled = false; $('rYes').textContent = 'Send removal request'; };
  $('rYes').onclick = async () => {
    $('rErr').hidden = true; $('rYes').disabled = true; const details = {};
    try {
      if (need.temporary) { const ref = $('rRef').value.trim(); if (!ref) return fail('Enter the approval number NZTA gave you'); details.nztaApprovalRef = ref; }
      else {
        const f = $('rPhoto').files[0]; if (!f) return fail('Add a photo of your zero alcohol licence');
        $('rYes').textContent = 'Uploading photo…';
        const path = `${S.user.id}/${Date.now()}.jpg`;
        const { error } = await withTimeout(db.storage.from('licences').upload(path, await shrink(f), { contentType: 'image/jpeg' }), 60000, 'Uploading the photo');
        if (error) throw error; details.zeroAlcoholLicencePhoto = path;
      }
      $('rYes').textContent = 'Sending…';
      const { error } = await db.rpc('book_next_slot', { p_location: r.location_id, p_date: r.session_date, p_service: 'rem', p_details: details });
      if (error) throw error;
      reload('Request sent. Matt will approve it.');
    } catch (e) { fail(errMsg(e)); }
  };
}
// phone photos are huge: scale to 1600px JPEG before upload
async function shrink(file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.82));
  } catch (e) { return file; }
}

function viewMe() {
  const d = customerDates(eng(), nzToday());
  $('view').innerHTML = `<h1>${esc([S.me.first_name, S.me.last_name].filter(Boolean).join(' '))}</h1>
    <div class="card"><div class="facts"><div class="fact"><div class="k">Mobile</div><div class="v">${esc(S.me.mobile || '—')}</div></div><div class="fact"><div class="k">Vehicle</div><div class="v">${esc(S.me.vehicle || '—')}</div></div></div>
      <p class="muted">Something wrong? Text Matt on <a href="sms:${MATT.replace(/ /g,'')}">${MATT}</a>.</p></div>
    <div class="card"><h2>Apply date</h2><p>Currently <b>${yDate(d.exitEligible)}</b>${S.me.apply_date ? ' (the date NZTA gave you)' : ' (12 months after install)'}.</p>
      <p class="muted">If you applied and NZTA declined it, they gave you a new date. Enter it here so your bookings line up with it.</p>
      <form id="adF"><label class="f" for="ad">New date from NZTA</label><input id="ad" type="date" value="${esc(S.me.apply_date || '')}"><div id="adErr" class="note bad" hidden></div><button class="btn brand">Save date</button></form></div>
    <div class="card"><h2>Keep this handy</h2><p class="muted">In your browser menu choose <b>Add to Home screen</b> to open this like an app.</p><button class="btn ghost" id="out">Sign out</button><p class="muted" style="text-align:center"><a href="../privacy/">Privacy policy</a></p></div>
    <p class="muted" style="text-align:center;font-size:.75rem">build 2026-11-10 09:23 UTC</p>`;
  $('out').onclick = signOut;
  $('adF').onsubmit = async ev => {
    ev.preventDefault();
    const r = setApplyDate(eng(), $('ad').value, { today: nzToday() });
    if (r.error) { $('adErr').textContent = r.error; $('adErr').hidden = false; return; }
    const { error } = await db.rpc('set_apply_date', { new_date: $('ad').value });
    if (error) return toast(errMsg(error), true);
    reload('Apply date saved');
  };
}

db.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !S.me && !S.starting) { S.starting = true; setTimeout(() => start().finally(() => S.starting = false), 0); } });
start();
</script>
