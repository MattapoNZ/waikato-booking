<style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Waikato Interlocks booking engine — sequential slot logic.
// No dependencies. All dates are NZ-local "YYYY-MM-DD" strings and all times are
// minutes after midnight, because every location is in one time zone.
//
// Core rule (matches how Timely is set up today with "minimise gaps"):
//   a customer is only ever offered ONE time per session — the earliest unbooked slot.
//   Cambridge Tue 9:20–10:10 with 5-min slots: first person sees 9:20, next sees 9:25 …
//   If someone cancels 9:30, the next customer is offered 9:30 (gap gets filled first).

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---------- date helpers (pure, timezone-free) ----------
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function fmtDate(dt) {
  return dt.toISOString().slice(0, 10);
}
function addDays(s, n) {
  const dt = parseDate(s);
  dt.setUTCDate(dt.getUTCDate() + n);
  return fmtDate(dt);
}
function weekday(s) {
  return parseDate(s).getUTCDay();
}
function hm(str) {
  // "9:20" -> 560
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, '0')}${ap}`;
}
// Which occurrence of its weekday a date is in its month: 1..5 ; and whether it is the last.
function nthOfMonth(s) {
  const d = parseDate(s).getUTCDate();
  const n = Math.ceil(d / 7);
  const isLast = parseDate(addDays(s, 7)).getUTCMonth() !== parseDate(s).getUTCMonth();
  return { n, isLast };
}

// ---------- recurrence ----------
// rule shapes:
//   { type: 'weekly',  weekdays: [2,4] }                 every Tue + Thu
//   { type: 'weekly',  weekdays: [2], everyNWeeks: 2, anchor: '2026-11-03' }  fortnightly
//   { type: 'monthly', weekday: 3, nth: 1 }               first Wednesday
//   { type: 'monthly', weekday: 5, nth: 'last' }          last Friday
//   { type: 'once',    date: '2026-12-23' }               one-off session
function ruleMatches(rule, date) {
  const wd = weekday(date);
  switch (rule.type) {
    case 'weekly': {
      if (!rule.weekdays.includes(wd)) return false;
      if (!rule.everyNWeeks || rule.everyNWeeks === 1) return true;
      const diffDays = Math.round((parseDate(date) - parseDate(rule.anchor)) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      return diffDays >= 0 && weeks % rule.everyNWeeks === 0;
    }
    case 'monthly': {
      if (wd !== rule.weekday) return false;
      const { n, isLast } = nthOfMonth(date);
      return rule.nth === 'last' ? isLast : n === rule.nth;
    }
    case 'once':
      return rule.date === date;
    default:
      return false;
  }
}

// ---------- sessions ----------
// A "schedule" is a standing pattern for a location, e.g. Cambridge Tue 9:20–10:10.
// schedule: { id, locationId, rule, start:'9:20', end:'10:10', slotMins:5, validFrom?, validTo? }
// exception: { locationId, date, kind:'closed' }                         — skip that day
//            { locationId, date, kind:'override', start, end, note? }     — different hours that day
//            { locationId, date, kind:'moved', toLocationId?, note }      — e.g. changed meeting point
function sessionsForRange({ schedules, exceptions = [], locations = [] }, fromDate, toDate) {
  const out = [];
  for (let d = fromDate; d <= toDate; d = addDays(d, 1)) {
    for (const s of schedules) {
      if (s.validFrom && d < s.validFrom) continue;
      if (s.validTo && d > s.validTo) continue;
      if (!ruleMatches(s.rule, d)) continue;
      const loc = locations.find(l => l.id === s.locationId);
      if (loc && loc.active === false) continue;
      const exs = exceptions.filter(e => e.locationId === s.locationId && e.date === d);
      if (exs.some(e => e.kind === 'closed')) continue;
      const ov = exs.find(e => e.kind === 'override');
      const start = hm(ov ? ov.start : s.start);
      const end = hm(ov ? ov.end : s.end);
      const notes = exs.filter(e => e.note).map(e => e.note);
      out.push({
        id: `${s.locationId}@${d}@${start}`,
        scheduleId: s.id,
        locationId: s.locationId,
        date: d,
        start,
        end,
        slotMins: s.slotMins || 5,
        // Removals queue AFTER servicing finishes: end .. end + removalSlots × removalMins
        removalSlots: s.removalSlots ?? 2,
        removalMins: s.removalMins ?? 15,
        notes,
      });
    }
  }
  return out.sort((a, b) => (a.date + String(a.start).padStart(4, '0')).localeCompare(b.date + String(b.start).padStart(4, '0')));
}

// All slot start times in a session that fit a service of `durationMins`.
function slotTimes(session, durationMins = session.slotMins) {
  const times = [];
  for (let t = session.start; t + durationMins <= session.end; t += session.slotMins) times.push(t);
  return times;
}

// Is [t, t+dur) free given existing bookings (each {start, duration, status})?
function isFree(t, dur, bookings) {
  return !bookings.some(b => b.status !== 'cancelled' && t < b.start + b.duration && b.start < t + dur);
}

function leadTimeOk(date, t, now, cutoffMins) {
  const dayDiff = Math.round((parseDate(date) - parseDate(now.date)) / 86400000);
  const minsUntil = dayDiff * 1440 + t - now.minutes;
  return minsUntil >= cutoffMins;
}

// Removal queue times: straight after the service window, one removal after another.
// Cambridge Tue (service ends 10:10, 2 removals of 15 min) -> 10:10, 10:25
function removalTimes(session) {
  const times = [];
  for (let i = 0; i < session.removalSlots; i++) times.push(session.end + i * session.removalMins);
  return times;
}

// The ONE time offered to a customer for this session, or null if full.
// kind 'removal' uses the removal queue after servicing; everything else uses the 5-min service slots.
// opts.now = { date, minutes } (NZ local), opts.cutoffMins = min lead time (Timely: 3 hours)
function nextOfferedSlot(session, bookings, durationMins = session.slotMins, opts = {}) {
  const removal = opts.kind === 'removal';
  const sessBookings = bookings.filter(b => b.sessionId === session.id && (b.kind === 'removal') === removal);
  const cutoff = opts.cutoffMins ?? 180;
  const dur = removal ? session.removalMins : durationMins;
  const times = removal ? removalTimes(session) : slotTimes(session, durationMins);
  for (const t of times) {
    if (!isFree(t, dur, sessBookings)) continue;
    if (opts.now && !leadTimeOk(session.date, t, opts.now, cutoff)) continue;
    return t;
  }
  return null;
}

// What the customer app shows: one row per upcoming session with its single offered time.
// horizonDays: Timely is currently set to 3 weeks ahead.
function customerAvailability(data, bookings, { fromDate, horizonDays = 21, durationMins = 5, kind = 'service', now, cutoffMins = 180, locationId } = {}) {
  const toDate = addDays(fromDate, horizonDays);
  return sessionsForRange(data, fromDate, toDate)
    .filter(s => !locationId || s.locationId === locationId)
    .map(s => ({ session: s, offered: nextOfferedSlot(s, bookings, durationMins, { now, cutoffMins, kind }) }))
    .filter(r => r.offered !== null);
}

// Create a booking — re-checks the slot so two people tapping at once can't both get 9:25.
// (In the real backend this is enforced by a unique index on (location, date, start) inside a transaction.)
// Services and resets are auto-confirmed. Removals are pencilled-in for Matt to accept.
function book(session, bookings, { customerId, serviceId, kind = 'service', durationMins = 5, requestedStart, now, cutoffMins = 180, customer, details = {} }) {
  if (kind === 'removal' && customer) {
    const req = removalRequirements(customer, session.date);
    if (req.temporary && !String(details.nztaApprovalRef || '').trim()) {
      return { ok: false, reason: 'This is before your apply date, so NZTA temporary removal approval is needed', needs: req.needs };
    }
    if (!req.temporary && !details.zeroAlcoholLicencePhoto) {
      return { ok: false, reason: 'Add a photo of your zero alcohol licence to request a removal', needs: req.needs };
    }
    if (req.temporary) details = { ...details, temporary: true };
  }
  const offered = nextOfferedSlot(session, bookings, durationMins, { now, cutoffMins, kind });
  if (offered === null) return { ok: false, reason: kind === 'removal' ? 'No removal spots left that day' : 'Session full' };
  if (requestedStart !== undefined && requestedStart !== offered) {
    return { ok: false, reason: 'That time was just taken', offered };
  }
  const booking = {
    id: `bk_${session.id}_${kind}_${offered}_${customerId}`,
    sessionId: session.id,
    locationId: session.locationId,
    date: session.date,
    start: offered,
    duration: kind === 'removal' ? session.removalMins : durationMins,
    customerId,
    serviceId,
    kind,
    status: kind === 'removal' ? 'pencilled' : 'confirmed',
    details,
  };
  return { ok: true, booking };
}

// ---------- customer rules ----------
// Customer: { installDate, subsidised, subsidyStart?, subsidyMonths=15, theftProtection, blockedServiceIds? }
function addMonths(s, n) {
  const dt = parseDate(s);
  const day = dt.getUTCDate();
  dt.setUTCDate(1);
  dt.setUTCMonth(dt.getUTCMonth() + n);
  const lastDay = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(day, lastDay));
  return fmtDate(dt);
}

// Subsidy runs 15 months from install, or from the later date they obtained it (subsidyStart).
function customerDates(c, today) {
  const subStart = c.subsidised ? (c.subsidyStart && c.subsidyStart > c.installDate ? c.subsidyStart : c.installDate) : null;
  const subsidyEnds = subStart ? addMonths(subStart, c.subsidyMonths ?? 15) : null;
  const standardExit = c.installDate ? addMonths(c.installDate, 12) : null;
  return {
    // Apply-for-removal date: 12 months after install, unless NZTA gave a new date after a denial
    // (the customer can enter that themselves — see setApplyDate).
    exitEligible: c.applyDate || standardExit,
    standardExit,
    applyDateSource: c.applyDate ? (c.applyDateSetBy || 'customer') : 'install',
    subsidyStart: subStart,
    subsidyEnds,
    subsidyActive: !!subsidyEnds && (!today || today < subsidyEnds),
  };
}

// Monthly service window = install day-of-month each month, ±7 days.
function serviceWindow(c, onOrAfter) {
  if (!c.installDate) return null;
  for (let i = 1; i < 60; i++) {
    const due = addMonths(c.installDate, i);
    if (addDays(due, 7) >= onOrAfter) return { due, opens: addDays(due, -7), closes: addDays(due, 7) };
  }
  return null;
}

// Exactly what this customer is allowed to book, worked out from their profile:
//  - ONE monthly service: subsidised or full price (by subsidy dates) × with/without theft protection
//  - both violation resets
//  - removal: from the apply date as normal; before it only as a temporary removal with NZTA approval
//    (free while still subsidised)
//  - changeover to another vehicle (request only, needs vehicle details)
//  - minus anything Matt has switched off for them (blockedServiceIds)
function allowedServices(c, services, today) {
  const d = customerDates(c, today);
  const tp = c.theftProtection !== false;
  const out = [];
  const monthly = services.find(s => s.group === 'service' && !!s.subsidised === d.subsidyActive && !!s.theftProtection === tp);
  if (monthly) out.push(monthly);
  out.push(...services.filter(s => s.group === 'violation'));
  const rem = services.find(s => s.group === 'removal');
  if (rem && c.installDate) {
    const early = !!d.exitEligible && today < d.exitEligible;
    out.push({ ...rem, price: d.subsidyActive ? 0 : rem.price,
      note: [d.subsidyActive ? 'Free while subsidised' : null, early ? 'Before your apply date — needs NZTA temporary removal approval' : null].filter(Boolean).join(' · ') || null });
  }
  out.push(...services.filter(s => s.group === 'changeover'));
  return out.filter(s => s.onlineBookable && !(c.blockedServiceIds || []).includes(s.id));
}

// Customer enters the new apply date NZTA gave them after a denied application.
// Returns the updated customer, or { error } if the date doesn't make sense.
function setApplyDate(c, newDate, { today, setBy = 'customer' } = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate || '') || isNaN(parseDate(newDate))) return { error: 'Enter the date NZTA gave you' };
  if (c.installDate && newDate <= c.installDate) return { error: 'That date is before your install date' };
  if (today && newDate < addDays(today, -365)) return { error: 'That date is more than a year ago — check the letter from NZTA' };
  return { customer: { ...c, applyDate: newDate, applyDateSetBy: setBy, applyDateSetOn: today || null } };
}

// To apply for removal NZTA needs a service AFTER the apply date.
// If a SERVICE booking falls in the last `warnDays` before the apply date, advise booking on/after it,
// and suggest the first session that day or later (from the availability list the app already has).
function applyDateAdvice(c, sessionDate, availability = [], { warnDays = 7, serviceGroup = 'service' } = {}) {
  const { exitEligible } = customerDates(c);
  if (!exitEligible) return null;
  if (!(sessionDate >= addDays(exitEligible, -warnDays) && sessionDate < exitEligible)) return null;
  const better = availability.find(r => r.session.date >= exitEligible) || null;
  const daysShort = Math.round((parseDate(exitEligible) - parseDate(sessionDate)) / 86400000);
  return {
    applyDate: exitEligible,
    daysShort,
    message: `This is ${daysShort} day${daysShort === 1 ? '' : 's'} before your apply date. To apply for removal you need a service on or after ${exitEligible}.`,
    suggestion: better, // { session, offered } or null if nothing in the booking horizon yet
  };
}

// Removal before the apply date = temporary removal: NZTA approval reference required (photo of the letter optional).
// Removal on/after the apply date = end of programme: photo of the zero alcohol licence required.
function removalRequirements(c, sessionDate) {
  const { exitEligible } = customerDates(c);
  const temporary = !!exitEligible && sessionDate < exitEligible;
  // From the apply date (end of programme) the customer shows their zero alcohol licence instead.
  return { temporary, needs: temporary ? ['nztaApprovalRef'] : ['zeroAlcoholLicencePhoto'], applyDate: exitEligible };
}

// Changeover: moving the interlock to another vehicle. A request (no slot) — Matt arranges the time.
// Vehicle details are required so he can tell if it's a standard or complex install.
const EUROPEAN = ['audi', 'bmw', 'mercedes', 'mercedes-benz', 'volkswagen', 'vw', 'volvo', 'skoda', 'peugeot', 'citroen', 'renault', 'mini', 'porsche', 'land rover', 'jaguar', 'fiat', 'alfa romeo', 'seat', 'cupra', 'opel', 'saab'];
function changeoverRequest(c, v = {}, { today, preferredLocationId = null, preferredDays = '', notes = '' } = {}) {
  const errors = {};
  const rego = String(v.rego || '').toUpperCase().replace(/\s+/g, '');
  if (!/^[A-Z0-9]{1,6}$/.test(rego)) errors.rego = 'Enter the plate (up to 6 letters/numbers)';
  if (!String(v.make || '').trim()) errors.make = 'Enter the make';
  if (!String(v.model || '').trim()) errors.model = 'Enter the model';
  const year = Number(v.year), maxYear = Number((today || '2100').slice(0, 4)) + 1;
  if (!(year >= 1980 && year <= maxYear)) errors.year = 'Enter the year';
  if (!['key', 'push'].includes(v.startType)) errors.startType = 'Key or push-button start?';
  if (!['petrol', 'diesel', 'hybrid', 'ev'].includes(v.fuel)) errors.fuel = 'Choose the fuel type';
  if (Object.keys(errors).length) return { ok: false, errors };
  const reasons = [];
  if (v.startType === 'push') reasons.push('push-button start');
  if (v.fuel === 'hybrid' || v.fuel === 'ev') reasons.push(v.fuel === 'ev' ? 'EV' : 'hybrid');
  if (EUROPEAN.includes(String(v.make).trim().toLowerCase())) reasons.push('European');
  return {
    ok: true,
    request: {
      id: `chg_${c.id}_${today || ''}_${rego}`,
      kind: 'changeover', customerId: c.id, status: 'requested', createdOn: today || null,
      vehicle: { rego, make: v.make.trim(), model: v.model.trim(), year, startType: v.startType, fuel: v.fuel },
      likelyInstall: reasons.length ? 'complex' : 'standard', complexReasons: reasons,
      // Dräger "Change vehicle": $290 standard / $350 complex, plus hourly labour if the wiring needs it
      quote: reasons.length ? 350 : 290,
      preferredLocationId, preferredDays, notes,
    },
  };
}

// What to charge on install day, as SEPARATE invoice lines (so Xero gets one line each):
//   1. install fee: $200 standard / $300 complex, $0 if subsidised (fee waived, still shown as a line)
//   2. first month = the customer's own monthly service item ($165, $172 with theft protection, $115 / $122 subsidised)
//   e.g. standard, full price, no theft protection: 200 + 165 = $365 (matches Timely today)
function installCharge(c, services, { complex = false, today } = {}) {
  const d = customerDates(c, today);
  const sub = c.subsidised && (d.subsidyActive || !today);
  const tp = c.theftProtection !== false;
  const fee = services.find(s => s.id === (sub ? 'inst-sub' : complex ? 'inst-cx' : 'inst'));
  const month = services.find(s => s.group === 'service' && !!s.subsidised === !!sub && !!s.theftProtection === tp);
  const lines = [
    { id: fee.id, name: fee.name, price: fee.price },
    { id: month.id, name: `${month.name} — first month`, price: month.price },
  ];
  return { lines, total: lines.reduce((a, l) => a + l.price, 0) };
}

async function start() {

async function loadBookings() {
  const { data, error } = await db.from('bookings')

  const e = eng(c), allowed = allowedServices(e, services, b.session_date);
  if (!allowed.some(s => s.id === b.service_id) && SVC(b.service_id).group === 'service') {
    const should = allowed.find(s => s.group === 'service');

      <div class="co-total"><span>Total</span><span class="t">${money(paid ? b.payments.reduce((a,p)=>a+p.amount_cents,0)/100 : total)}</span></div>
      <div class="empty">Includes GST ${money((paid ? b.payments.reduce((a,p)=>a+p.amount_cents,0)/100 : total) * 3 / 23)}</div></div>
    ${paid ? `<div class="alert" style="background:var(--ok-soft);color:var(--ok)">Paid by ${esc(b.payments.map(p => p.method.replace(/_/g,' ')).join(', '))}.</div>
      <div id="undoBox" style="margin-top:8px"><button class="btn ghost" id="undoPay" style="width:100%">Cancel sale and redo</button></div>`
      : `<div class="label" style="margin-top:12px">Take payment</div><div class="grid2">
        ${[['card_terminal','Card terminal'],['tap_to_pay','Tap to Pay'],['cash','Cash'],['on_account','On account']].map(([v,l],i)=>`<button class="btn ${i?'ghost':''}" data-pay="${v}">${l}</button>`).join('')}</div>
        <div class="grid2"><button class="btn ghost" data-st="arrived">Arrived</button><button class="btn ghost" data-st="no_show">No-show</button></div>
        <div style="margin-top:6px"><button class="btn ghost" data-st="cancelled" style="width:100%">Cancel booking</button></div>`}`;
  el.querySelectorAll('[data-x]').forEach(x => x.onclick = () => { S.extras.push(x.dataset.x); renderSide(); });
  const af = $('addFee'); if (af) af.onclick = () => { const v = $('moreFee').value; if (v) { S.extras.push(v); renderSide(); } };
  const cx = $('clrX'); if (cx) cx.onclick = () => { S.extras = []; renderSide(); };
  el.querySelectorAll('[data-st]').forEach(x => x.onclick = () => setStatus(b, x.dataset.st));
  el.querySelectorAll('[data-pay]').forEach(x => x.onclick = () => takePayment(b, x.dataset.pay, total));
  const up = $('undoPay'); if (up) up.onclick = () => {
    $('undoBox').innerHTML = `<div class="alert">Cancel this ${money(b.payments.reduce((a,p)=>a+p.amount_cents,0)/100)} sale? Refund any card payment on the terminal yourself.</div>
      <div class="grid2"><button class="btn" id="undoYes">Yes, cancel sale</button><button class="btn ghost" id="undoNo">Keep it</button></div>`;
    $('undoNo').onclick = () => renderSide();
    $('undoYes').onclick = () => undoPayment(b);
  };
}
function showSide() { if (matchMedia('(max-width:960px)').matches) setTimeout(() => $('side')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
async function undoPayment(b) {
  const { error } = await db.from('payments').delete().eq('booking_id', b.id);
  if (error) return toast(errMsg(error), true);
  await db.from('bookings').update({ status: 'arrived' }).eq('id', b.id);
  S.extras = (b.payments[0]?.provider_ref || '').startsWith('extras:') ? b.payments[0].provider_ref.slice(7).split(',') : [];
  toast('Sale cancelled — redo it below'); await loadBookings(); renderRun();
}

async function setStatus(b, st) {
  const { error } = await db.from('bookings').update({ status: st, ...(st === 'cancelled' ? { cancelled_at: new Date().toISOString() } : {}) }).eq('id', b.id);
  if (error) return toast(errMsg(error), true);
  toast(st === 'cancelled' ? 'Booking cancelled — the slot is free again' : 'Updated');
  if (st === 'cancelled') S.sel = null;
  await loadBookings(); renderRun();
}
async function takePayment(b, method, total) {
  document.querySelectorAll('[data-pay]').forEach(x => x.disabled = true);
  const { error } = await db.from('payments').insert({ booking_id: b.id, customer_id: b.customer_id, amount_cents: Math.round(total * 100), method,
    provider_ref: S.extras.length ? 'extras:' + S.extras.join(',') : null });
  if (error) { document.querySelectorAll('[data-pay]').forEach(x => x.disabled = false); return toast(errMsg(error), true); }
  await db.from('bookings').update({ status: 'completed' }).eq('id', b.id);
  S.extras = []; toast(`Paid ${money(total)}`); await loadBookings(); renderRun();
}

// ---------- add booking (staff) ----------
async function renderAddBooking(locId, walkin = false) {
  const el = $('side');
  el.innerHTML = `<h2>${walkin ? 'Walk-in sale' : 'Add booking'} · ${esc(LOC(locId))}</h2><div class="empty">${longDate(S.date)}${walkin ? ' · no booking needed, goes straight to checkout' : ''}</div>
    <input id="abQ" placeholder="Search name or mobile" style="width:100%;margin-top:10px" autocomplete="off"><div class="list" id="abList"></div>
    <button class="btn ghost" id="abNew" style="margin-top:8px">+ New customer</button><div id="abPick"></div>`;
  $('abNew').onclick = () => {
    $('abList').innerHTML = '';
    $('abPick').innerHTML = `<form class="form" id="ncf" style="margin-top:10px">
      <label>First name<input id="n_first" required></label><label>Last name<input id="n_last"></label>
      <label>Mobile<input id="n_mob" inputmode="tel" placeholder="021…"></label><label>Install date<input id="n_inst" type="date" value="${S.date}"></label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="n_sub"> Subsidised</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="n_tp" checked> Theft protection</label>
      <div class="full"><button class="btn brand">Save customer</button></div></form>`;
    $('ncf').onsubmit = async e => {
      e.preventDefault();
      let m = $('n_mob').value.replace(/[^\d+]/g, ''); if (m.startsWith('0')) m = '+64' + m.slice(1);
      const { data, error } = await db.from('customers').insert({ first_name: $('n_first').value.trim(), last_name: $('n_last').value.trim() || null, mobile: m || null,
        install_date: $('n_inst').value || null, subsidised: $('n_sub').checked, theft_protection: $('n_tp').checked, notes: `Added on run sheet ${nzToday()}` }).select().single();
      if (error) return toast(errMsg(error), true);
      toast('Customer saved'); pick(data);
    };
  };
  const search = async () => {
    const q = $('abQ').value.trim(); if (q.length < 2) { $('abList').innerHTML = ''; return; }
    const like = `%${q}%`;
    const { data } = await db.from('customers').select('*').or(`first_name.ilike.${like},last_name.ilike.${like},mobile.ilike.${like}`).limit(8);
    $('abList').innerHTML = (data||[]).map(c => `<div class="item" data-c="${c.id}"><span><b>${esc(fullName(c))}</b><br><span class="empty">${esc(c.mobile||'')}</span></span><span class="empty">Installed ${yDate(c.install_date)}</span></div>`).join('') || '<div class="empty">No match</div>';
    $('abList').querySelectorAll('[data-c]').forEach(it => it.onclick = () => pick(data.find(c => c.id === it.dataset.c)));
  };
  let t; $('abQ').oninput = () => { clearTimeout(t); t = setTimeout(search, 250); }; $('abQ').focus();
  function pick(c) {
    let opts = allowedServices(eng(c), services, S.date).filter(s => s.group !== 'changeover');
    if (walkin) opts = opts.filter(s => s.group !== 'removal');
    $('abList').innerHTML = '';
    $('abPick').innerHTML = `<div style="margin-top:10px"><b>${esc(fullName(c))}</b> · installed ${yDate(c.install_date)}</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${opts.map(s => `<button class="btn ghost" style="text-align:left" data-s="${s.id}">${esc(s.name)} · ${money(s.price)}${s.note?`<br><span class="empty">${esc(s.note)}</span>`:''}</button>`).join('')}</div>
      <div id="remExtra"></div>`;
    $('abPick').querySelectorAll('[data-s]').forEach(btn => btn.onclick = async () => {
      let details = {};
      if (btn.dataset.s === 'rem') {
        const req = removalRequirements(eng(c), S.date);
        if (!$('remRef')) {
          $('remExtra').innerHTML = req.temporary
            ? `<label class="label" for="remRef" style="margin-top:8px;display:block">NZTA temporary removal approval number</label><input id="remRef" style="width:100%"><button class="btn" id="remGo" style="margin-top:6px">Book removal</button>`
            : `<label class="label" style="margin-top:8px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="remRef"> I've seen their zero alcohol licence</label><button class="btn" id="remGo" style="margin-top:6px">Book removal</button>`;
          $('remGo').onclick = () => {
            details = req.temporary ? { nztaApprovalRef: $('remRef').value.trim() } : ($('remRef').checked ? { zeroAlcoholLicencePhoto: 'seen in person by staff' } : {});
            doBook(c, 'rem', details);
          };
          return;
        }
      }
      doBook(c, btn.dataset.s, details);
    });
  }
  async function doBook(c, svc, details) {
    if (walkin) return doWalkin(c, svc);
    const { data, error } = await db.rpc('book_next_slot', { p_location: locId, p_date: S.date, p_service: svc, p_details: details, p_customer: c.id });
    if (error) return toast(errMsg(error), true);
    toast(`Booked ${fullName(c)} at ${fmtTime(data.start_min)}`); S.sel = data.id; await loadBookings(); renderRun();
  }
  // Walk-in: recorded at the current time (off the 5-min grid), already arrived, straight to checkout.
  async function doWalkin(c, svcId) {
    const svc = allowedServices(eng(c), services, S.date).find(s => s.id === svcId) || SVC(svcId);
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Pacific/Auckland' }));
    const sess = S.sessions.find(x => x.location_id === locId && x.session_date === S.date);
    let t = S.date === nzToday() ? now.getHours() * 60 + now.getMinutes() : (sess ? sess.end_min : 720);
    const used = new Set(S.bookings.filter(b => b.location_id === locId).map(b => b.start_min));
    while (used.has(t)) t++;
    const { data, error } = await db.from('bookings').insert({ customer_id: c.id, service_id: svc.id, location_id: locId, session_date: S.date, start_min: t,
      duration_mins: svc.duration || 5, kind: 'service', status: 'arrived', source: 'walkin', price_cents: Math.round((svc.price || 0) * 100), details: {} }).select().single();
    if (error) return toast(errMsg(error), true);
    toast(`Walk-in added: ${fullName(c)}`); S.sel = data.id; S.extras = []; await loadBookings(); renderRun();
  }
}

// ---------- customers ----------
async function renderCustomers() {
  $('body').innerHTML = `<div class="layout"><div class="panel"><input id="cq" placeholder="Search name or mobile" style="width:100%" value="${esc(S.custQ)}" autocomplete="off"><div class="list" id="clist"></div></div>
    <aside class="panel side" id="cside"><p class="empty">Pick a customer to edit their install date, subsidy and theft protection.</p></aside></div>`;
  const load = async () => {
    const q = $('cq').value.trim(); S.custQ = q;
    let req = db.from('customers').select('*').order('first_name').limit(100);
    if (q.length >= 2) req = req.or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,mobile.ilike.%${q}%`);
    const { data, error } = await req; if (error) return toast(errMsg(error), true);
    S.customers = data;
    $('clist').innerHTML = data.map(c => { const d = customerDates(eng(c), nzToday()); return `<div class="item" data-c="${c.id}"><span><b>${esc(fullName(c))}</b><br><span class="empty">${esc(c.mobile||'no mobile')}</span></span>
      <span class="empty" style="text-align:right">Installed ${yDate(c.install_date)}<br>${c.subsidised ? (d.subsidyActive ? 'Subsidised' : 'Subsidy ended') : 'Full price'}${c.theft_protection?' · TP':''}</span></div>`; }).join('') || '<div class="empty">No customers found</div>';
    $('clist').querySelectorAll('[data-c]').forEach(it => it.onclick = () => editCustomer(S.customers.find(c => c.id === it.dataset.c)));
  };
  let t; $('cq').oninput = () => { clearTimeout(t); t = setTimeout(load, 250); }; load();
}
function editCustomer(c) {
  const d = customerDates(eng(c), nzToday());
  $('cside').innerHTML = `<h2>${esc(fullName(c))}</h2><div class="empty">${esc(c.mobile || '')} · ${esc(c.email || '')}</div>
    <form class="form" id="cf" style="margin-top:10px">
      <label>First name<input id="f_first" value="${esc(c.first_name)}"></label><label>Last name<input id="f_last" value="${esc(c.last_name)}"></label>
      <label>Mobile<input id="f_mob" value="${esc(c.mobile)}"></label><label>Email<input id="f_em" value="${esc(c.email)}"></label>
      <label>Install date<input id="f_inst" type="date" value="${esc(c.install_date)}"></label><label>Vehicle<input id="f_veh" value="${esc(c.vehicle)}"></label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="f_sub" ${c.subsidised?'checked':''}> Subsidised</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="f_tp" ${c.theft_protection?'checked':''}> Theft protection</label>
      <label>Subsidy obtained (if later than install)<input id="f_ss" type="date" value="${esc(c.subsidy_start)}"></label>
      <label>NZTA apply date (if changed)<input id="f_ad" type="date" value="${esc(c.apply_date)}"></label>
      <label class="full">Alert (shows in red at checkout)<input id="f_al" value="${esc(c.alerts)}"></label>
      <label class="full">Notes<textarea id="f_no" rows="3">${esc(c.notes)}</textarea></label>
      <div class="full empty">Apply date ${yDate(d.exitEligible)} · subsidy ${d.subsidyEnds ? (d.subsidyActive ? 'until ' : 'ended ') + yDate(d.subsidyEnds) : 'none'}</div>
      <div class="full"><button class="btn brand">Save</button></div></form>`;
  $('cf').onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim() || null;
    const upd = { first_name: v('f_first'), last_name: v('f_last'), mobile: v('f_mob'), email: v('f_em'), install_date: v('f_inst'), vehicle: v('f_veh'),
      subsidised: $('f_sub').checked, theft_protection: $('f_tp').checked, subsidy_start: v('f_ss'), alerts: v('f_al'), notes: v('f_no') };
    const ad = v('f_ad'); if (ad !== c.apply_date) Object.assign(upd, { apply_date: ad, apply_date_set_by: ad ? 'staff' : null, apply_date_set_on: ad ? new Date().toISOString() : null });
    const { error } = await db.from('customers').update(upd).eq('id', c.id);
    if (error) return toast(errMsg(error), true);
    toast('Saved'); renderCustomers();
  };
}

start();
</script>
