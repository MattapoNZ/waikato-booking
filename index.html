<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
// Waikato Interlocks booking engine — sequential slot logic.
// No dependencies. All dates are NZ-local "YYYY-MM-DD" strings and all times are
// minutes after midnight, because every location is in one time zone.
//
// Core rule (matches how Timely is set up today with "minimise gaps"):
//   a customer is only ever offered ONE time per session — the earliest unbooked slot.
//   Cambridge Tue 9:20–10:10 with 5-min slots: first person sees 9:20, next sees 9:25 …
//   If someone cancels 9:30, the next customer is offered 9:30 (gap gets filled first).

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ---------- date helpers (pure, timezone-free) ----------
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function fmtDate(dt) {
  return dt.toISOString().slice(0, 10);
}
function addDays(s, n) {
  const dt = parseDate(s);
  dt.setUTCDate(dt.getUTCDate() + n);
  return fmtDate(dt);
}
function weekday(s) {
  return parseDate(s).getUTCDay();
}
function hm(str) {
  // "9:20" -> 560
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function fmtTime(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const ap = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(m).padStart(2, '0')}${ap}`;
}
// Which occurrence of its weekday a date is in its month: 1..5 ; and whether it is the last.
function nthOfMonth(s) {
  const d = parseDate(s).getUTCDate();
  const n = Math.ceil(d / 7);
  const isLast = parseDate(addDays(s, 7)).getUTCMonth() !== parseDate(s).getUTCMonth();
  return { n, isLast };
}

// ---------- recurrence ----------
// rule shapes:
//   { type: 'weekly',  weekdays: [2,4] }                 every Tue + Thu
//   { type: 'weekly',  weekdays: [2], everyNWeeks: 2, anchor: '2026-11-03' }  fortnightly
//   { type: 'monthly', weekday: 3, nth: 1 }               first Wednesday
//   { type: 'monthly', weekday: 5, nth: 'last' }          last Friday
//   { type: 'once',    date: '2026-12-23' }               one-off session
function ruleMatches(rule, date) {
  const wd = weekday(date);
  switch (rule.type) {
    case 'weekly': {
      if (!rule.weekdays.includes(wd)) return false;
      if (!rule.everyNWeeks || rule.everyNWeeks === 1) return true;
      const diffDays = Math.round((parseDate(date) - parseDate(rule.anchor)) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      return diffDays >= 0 && weeks % rule.everyNWeeks === 0;
    }
    case 'monthly': {
      if (wd !== rule.weekday) return false;
      const { n, isLast } = nthOfMonth(date);
      return rule.nth === 'last' ? isLast : n === rule.nth;
    }
    case 'once':
      return rule.date === date;
    default:
      return false;
  }
}

// ---------- sessions ----------
// A "schedule" is a standing pattern for a location, e.g. Cambridge Tue 9:20–10:10.
// schedule: { id, locationId, rule, start:'9:20', end:'10:10', slotMins:5, validFrom?, validTo? }
// exception: { locationId, date, kind:'closed' }                         — skip that day
//            { locationId, date, kind:'override', start, end, note? }     — different hours that day
//            { locationId, date, kind:'moved', toLocationId?, note }      — e.g. changed meeting point
function sessionsForRange({ schedules, exceptions = [], locations = [] }, fromDate, toDate) {
  const out = [];
  for (let d = fromDate; d <= toDate; d = addDays(d, 1)) {
    for (const s of schedules) {
      if (s.validFrom && d < s.validFrom) continue;
      if (s.validTo && d > s.validTo) continue;
      if (!ruleMatches(s.rule, d)) continue;
      const loc = locations.find(l => l.id === s.locationId);
      if (loc && loc.active === false) continue;
      const exs = exceptions.filter(e => e.locationId === s.locationId && e.date === d);
      if (exs.some(e => e.kind === 'closed')) continue;
      const ov = exs.find(e => e.kind === 'override');
      const start = hm(ov ? ov.start : s.start);
      const end = hm(ov ? ov.end : s.end);
      const notes = exs.filter(e => e.note).map(e => e.note);
      out.push({
        id: `${s.locationId}@${d}@${start}`,
        scheduleId: s.id,
        locationId: s.locationId,
        date: d,
        start,
        end,
        slotMins: s.slotMins || 5,
        // Removals are floating placeholders (see removalEstimates): up to removalSlots per session
        removalSlots: s.removalSlots ?? 3,
        removalMins: s.removalMins ?? 15,
        notes,
      });
    }
  }
  return out.sort((a, b) => (a.date + String(a.start).padStart(4, '0')).localeCompare(b.date + String(b.start).padStart(4, '0')));
}

// All slot start times in a session that fit a service of `durationMins`.
function slotTimes(session, durationMins = session.slotMins) {
  const times = [];
  for (let t = session.start; t + durationMins <= session.end; t += session.slotMins) times.push(t);
  return times;
}

// Is [t, t+dur) free given existing bookings (each {start, duration, status})?
function isFree(t, dur, bookings) {
  return !bookings.some(b => b.status !== 'cancelled' && t < b.start + b.duration && b.start < t + dur);
}

function leadTimeOk(date, t, now, cutoffMins) {
  const dayDiff = Math.round((parseDate(date) - parseDate(now.date)) / 86400000);
  const minsUntil = dayDiff * 1440 + t - now.minutes;
  return minsUntil >= cutoffMins;
}

// ---------- removals: floating placeholders ----------
// A removal does NOT hold a time. It is a placeholder that sits at the first free gap in the
// session and slides later whenever a service or violation reset books that time:
//   removal requested when 11:30 is free -> shows "about 11:30"; someone books a service at 11:30
//   -> the removal now shows "about 11:35", and so on.
// It only becomes a solid, held time once Matt has approved it AND times are locked on the
// morning of the session. Until then services always win.
// booking fields used: { id, start, duration, status, kind, timeLocked, approvedAt, createdAt }
//   timeLocked === false  -> floating removal;  anything else -> fixed (holds its time)
const isFloating = b => b.kind === 'removal' && b.timeLocked === false && b.status !== 'cancelled';
// timeLocked === false on anything else (e.g. a walk-in sale) means it is on the sheet but holds no slot
const isFixed = b => b.status !== 'cancelled' && b.timeLocked !== false;

// Estimated time for every floating removal in this session: Map(bookingId -> minutes).
// Approved ones are placed first, then in the order they were requested.
function removalEstimates(session, bookings, { onlyApproved = false, extra = 0 } = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const fixed = sess.filter(isFixed).map(b => ({ start: b.start, duration: b.duration, status: 'confirmed' }));
  const floaters = sess.filter(isFloating).filter(b => !onlyApproved || b.approvedAt)
    .map((b, i) => ({ b, i }))
    .sort((x, y) => (!x.b.approvedAt - !y.b.approvedAt) || String(x.b.createdAt || '').localeCompare(String(y.b.createdAt || '')) || x.i - y.i)
    .map(x => x.b);
  const out = new Map();
  const place = () => {
    let t = session.start;
    while (!isFree(t, session.removalMins, fixed)) t += session.slotMins;
    fixed.push({ start: t, duration: session.removalMins, status: 'confirmed' });
    return t;
  };
  for (const b of floaters) out.set(b.id, place());
  for (let i = 0; i < extra; i++) out.set(`new${i}`, place());   // where the NEXT request would sit
  return out;
}

// Morning of the session: approved removals take a solid time and now hold it. Unapproved ones stay floating.
function lockRemovals(session, bookings) {
  const est = removalEstimates(session, bookings, { onlyApproved: true });
  return bookings.map(b => est.has(b.id) ? { ...b, start: est.get(b.id), timeLocked: true, status: 'confirmed' } : b);
}

// The ONE time offered to a customer for this session, or null if full.
// Services / resets: earliest 5-min slot not held by a service or a LOCKED removal (floating removals are ignored).
// Removals: an approximate time only — null once the session has its limit of removals (default 3).
// opts.now = { date, minutes } (NZ local), opts.cutoffMins = min lead time (Timely: 3 hours)
function nextOfferedSlot(session, bookings, durationMins = session.slotMins, opts = {}) {
  const sess = bookings.filter(b => b.sessionId === session.id);
  const cutoff = opts.cutoffMins ?? 180;
  if (opts.kind === 'removal') {
    if (sess.filter(b => b.kind === 'removal' && b.status !== 'cancelled').length >= session.removalSlots) return null;
    if (opts.now && !leadTimeOk(session.date, session.start, opts.now, cutoff)) return null;
    return removalEstimates(session, bookings, { extra: 1 }).get('new0');
  }
  const fixed = sess.filter(isFixed);
  for (const t of slotTimes(session, durationMins)) {
    if (!isFree(t, durationMins, fixed)) continue;
    if (opts.now && !leadTimeOk(session.date, t, opts.now, cutoff)) continue;
    return t;
  }
  return null;
}

// What the customer app shows: one row per upcoming session with its single offered time.
// horizonDays: Timely is currently set to 3 weeks ahead.
function customerAvailability(data, bookings, { fromDate, horizonDays = 21, durationMins = 5, kind = 'service', now, cutoffMins = 180, locationId } = {}) {
  const toDate = addDays(fromDate, horizonDays);
  return sessionsForRange(data, fromDate, toDate)
    .filter(s => !locationId || s.locationId === locationId)
    .map(s => ({ session: s, offered: nextOfferedSlot(s, bookings, durationMins, { now, cutoffMins, kind }) }))
    .filter(r => r.offered !== null);
}

// Create a booking — re-checks the slot so two people tapping at once can't both get 9:25.
// (In the real backend this is enforced by a unique index on (location, date, start) inside a transaction.)
// Services and resets are auto-confirmed and hold their time. Removals are floating placeholders:
// pencilled, no held time, until Matt approves and times are locked on the morning.
function book(session, bookings, { customerId, serviceId, kind = 'service', durationMins = 5, requestedStart, now, cutoffMins = 180, customer, details = {} }) {
  if (kind === 'removal' && customer) {
    const req = removalRequirements(customer, session.date);
    if (req.temporary && !String(details.nztaApprovalRef || '').trim()) {
      return { ok: false, reason: 'This is before your apply date, so NZTA temporary removal approval is needed', needs: req.needs };
    }
    if (!req.temporary && !details.zeroAlcoholLicencePhoto) {
      return { ok: false, reason: 'Add a photo of your zero alcohol licence to request a removal', needs: req.needs };
    }
    if (req.temporary) details = { ...details, temporary: true };
  }
  const offered = nextOfferedSlot(session, bookings, durationMins, { now, cutoffMins, kind });
  if (offered === null) return { ok: false, reason: kind === 'removal' ? 'No removal spots left that day' : 'Session full' };
  if (kind !== 'removal' && requestedStart !== undefined && requestedStart !== offered) {
    return { ok: false, reason: 'That time was just taken', offered };
  }
  const booking = {
    id: `bk_${session.id}_${kind}_${kind === 'removal' ? 'float' : offered}_${customerId}`,
    sessionId: session.id,
    locationId: session.locationId,
    date: session.date,
    start: offered,
    duration: kind === 'removal' ? session.removalMins : durationMins,
    customerId,
    serviceId,
    kind,
    status: kind === 'removal' ? 'pencilled' : 'confirmed',
    timeLocked: kind !== 'removal',   // removals float until approved + locked
    approvedAt: null,
    details,
  };
  return { ok: true, booking };
}

// ---------- customer rules ----------
// Customer: { installDate, subsidised, subsidyStart?, subsidyMonths=15, theftProtection, blockedServiceIds? }
function addMonths(s, n) {
  const dt = parseDate(s);
  const day = dt.getUTCDate();
  dt.setUTCDate(1);
  dt.setUTCMonth(dt.getUTCMonth() + n);
  const lastDay = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(day, lastDay));
  return fmtDate(dt);
}

// Subsidy runs 15 months from install, or from the later date they obtained it (subsidyStart).
function customerDates(c, today) {
  const subStart = c.subsidised ? (c.subsidyStart || c.installDate) : null;   // the date on the NZTA subsidy letter if we have it, else the install date
  const subsidyEnds = subStart ? addMonths(subStart, c.subsidyMonths ?? 15) : null;
  const standardExit = c.installDate ? addMonths(c.installDate, 12) : null;
  return {
    // Apply-for-removal date: 12 months after install, unless NZTA gave a new date after a denial
    // (the customer can enter that themselves — see setApplyDate).
    exitEligible: c.applyDate || standardExit,
    standardExit,
    applyDateSource: c.applyDate ? (c.applyDateSetBy || 'customer') : 'install',
    subsidyStart: subStart,
    subsidyEnds,
    // The subsidy stays ACTIVE until staff switch it off (when Dräger emails to say it has ended).
    // subsidyEnds is only the expected end; subsidyOverdue flags that the 15 months have passed.
    subsidyActive: !!c.subsidised,
    subsidyOverdue: !!c.subsidised && !!subsidyEnds && !!today && today >= subsidyEnds,
  };
}

// Monthly service window = rollover day-of-month each month, ±7 days.
// The rollover date is the install date unless it was changed (e.g. a second device was fitted later).
// `servicedDates` = days a MONTHLY SERVICE was actually done and charged (not a violation reset or a
// data reading). A window that already has one is finished, so the next month's window is returned.
// A service up to 20 days before the due date counts for that month (an early visit; the previous
// month's window has closed by then).
// `c.dueOverrides` = [{ normal_due, due }]: Matt moved that one month's due date (e.g. over Christmas).
// The month after goes back to the normal day.
const EARLY_SERVICE_DAYS = 20;
function serviceWindow(c, onOrAfter, servicedDates = []) {
  const anchor = c.rolloverDate || c.installDate;
  if (!anchor) return null;
  for (let i = 0; i < 600; i++) {
    const normalDue = addMonths(anchor, i);
    if (i === 0 && !c.rolloverDate) continue;   // install day itself is not a service
    const ov = (c.dueOverrides || []).find(o => o.normal_due === normalDue);
    const due = ov ? ov.due : normalDue;
    const opens = addDays(due, -7), closes = addDays(due, 7);
    if (closes < onOrAfter) continue;
    if (servicedDates.some(d => d >= addDays(due, -EARLY_SERVICE_DAYS) && d <= closes)) continue;   // this month's service is done
    return { due, normalDue, moved: !!ov, opens, closes };
  }
  return null;
}
// The days a customer had their monthly service, from their bookings: completed, and the thing charged was the service itself.
function servicedDates(bookings, services) {
  return bookings.filter(b => b.status === 'completed' && (services.find(s => s.id === b.service_id) || {}).group === 'service').map(b => b.session_date);
}

// Exactly what this customer is allowed to book, worked out from their profile:
//  - ONE monthly service: subsidised or full price (by subsidy dates) × with/without theft protection
//  - both violation resets
//  - removal: from the apply date as normal; before it only as a temporary removal with NZTA approval
//    (free while still subsidised)
//  - changeover to another vehicle (request only, needs vehicle details)
//  - minus anything Matt has switched off for them (blockedServiceIds)
function allowedServices(c, services, today) {
  const d = customerDates(c, today);
  const tp = c.theftProtection !== false;
  const out = [];
  const monthly = services.find(s => s.group === 'service' && !!s.subsidised === d.subsidyActive && !!s.theftProtection === tp);
  if (monthly) out.push(monthly);
  out.push(...services.filter(s => s.group === 'violation'));
  const rem = services.find(s => s.group === 'removal');
  if (rem && c.installDate) {
    const early = !!d.exitEligible && today < d.exitEligible;
    out.push({ ...rem, price: d.subsidyActive ? 0 : rem.price,
      note: [d.subsidyActive ? 'Free while subsidised' : null, early ? 'Before your apply date — needs NZTA temporary removal approval' : null].filter(Boolean).join(' · ') || null });
  }
  out.push(...services.filter(s => s.group === 'changeover'));
  return out.filter(s => s.onlineBookable && !(c.blockedServiceIds || []).includes(s.id));
}

// Customer enters the new apply date NZTA gave them after a denied application.
// Returns the updated customer, or { error } if the date doesn't make sense.
function setApplyDate(c, newDate, { today, setBy = 'customer' } = {}) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate || '') || isNaN(parseDate(newDate))) return { error: 'Enter the date NZTA gave you' };
  if (c.installDate && newDate <= c.installDate) return { error: 'That date is before your install date' };
  if (today && newDate < addDays(today, -365)) return { error: 'That date is more than a year ago — check the letter from NZTA' };
  return { customer: { ...c, applyDate: newDate, applyDateSetBy: setBy, applyDateSetOn: today || null } };
}

// To apply for removal NZTA needs a service AFTER the apply date.
// If a SERVICE booking falls in the last `warnDays` before the apply date, advise booking on/after it,
// and suggest the first session that day or later (from the availability list the app already has).
function applyDateAdvice(c, sessionDate, availability = [], { warnDays = 7, serviceGroup = 'service' } = {}) {
  const { exitEligible } = customerDates(c);
  if (!exitEligible) return null;
  if (!(sessionDate >= addDays(exitEligible, -warnDays) && sessionDate < exitEligible)) return null;
  const better = availability.find(r => r.session.date >= exitEligible) || null;
  const daysShort = Math.round((parseDate(exitEligible) - parseDate(sessionDate)) / 86400000);
  return {
    applyDate: exitEligible,
    daysShort,
    message: `This is ${daysShort} day${daysShort === 1 ? '' : 's'} before your apply date. To apply for removal you need a service on or after ${exitEligible}.`,
    suggestion: better, // { session, offered } or null if nothing in the booking horizon yet
  };
}

// Removal before the apply date = temporary removal: NZTA approval reference required (photo of the letter optional).
// Removal on/after the apply date = end of programme: photo of the zero alcohol licence required.
function removalRequirements(c, sessionDate) {
  const { exitEligible } = customerDates(c);
  const temporary = !!exitEligible && sessionDate < exitEligible;
  // From the apply date (end of programme) the customer shows their zero alcohol licence instead.
  return { temporary, needs: temporary ? ['nztaApprovalRef'] : ['zeroAlcoholLicencePhoto'], applyDate: exitEligible };
}

// Changeover: moving the interlock to another vehicle. A request (no slot) — Matt arranges the time.
// Vehicle details are required so he can tell if it's a standard or complex install.
const EUROPEAN = ['audi', 'bmw', 'mercedes', 'mercedes-benz', 'volkswagen', 'vw', 'volvo', 'skoda', 'peugeot', 'citroen', 'renault', 'mini', 'porsche', 'land rover', 'jaguar', 'fiat', 'alfa romeo', 'seat', 'cupra', 'opel', 'saab'];
function changeoverRequest(c, v = {}, { today, preferredLocationId = null, preferredDays = '', siteAddress = '', approxTime = '', notes = '' } = {}) {
  const errors = {};
  const rego = String(v.rego || '').toUpperCase().replace(/\s+/g, '');
  if (!/^[A-Z0-9]{1,6}$/.test(rego)) errors.rego = 'Enter the plate (up to 6 letters/numbers)';
  if (!String(v.make || '').trim()) errors.make = 'Enter the make';
  if (!String(v.model || '').trim()) errors.model = 'Enter the model';
  const year = Number(v.year), maxYear = Number((today || '2100').slice(0, 4)) + 1;
  if (!(year >= 1980 && year <= maxYear)) errors.year = 'Enter the year';
  if (!['key', 'push'].includes(v.startType)) errors.startType = 'Key or push-button start?';
  if (!['petrol', 'diesel', 'hybrid', 'ev'].includes(v.fuel)) errors.fuel = 'Choose the fuel type';
  // Changeovers are done on site: Matt comes to the vehicle, so we need where and roughly when.
  if (!String(siteAddress || '').trim()) errors.siteAddress = 'Where is the vehicle? (address)';
  if (!String(approxTime || '').trim() && !String(preferredDays || '').trim()) errors.approxTime = 'Roughly what day and time suits?';
  if (Object.keys(errors).length) return { ok: false, errors };
  const reasons = [];
  if (v.startType === 'push') reasons.push('push-button start');
  if (v.fuel === 'hybrid' || v.fuel === 'ev') reasons.push(v.fuel === 'ev' ? 'EV' : 'hybrid');
  if (EUROPEAN.includes(String(v.make).trim().toLowerCase())) reasons.push('European');
  return {
    ok: true,
    request: {
      id: `chg_${c.id}_${today || ''}_${rego}`,
      kind: 'changeover', customerId: c.id, status: 'requested', createdOn: today || null,
      vehicle: { rego, make: v.make.trim(), model: v.model.trim(), year, startType: v.startType, fuel: v.fuel },
      likelyInstall: reasons.length ? 'complex' : 'standard', complexReasons: reasons,
      // Dräger "Change vehicle": $290 standard / $350 complex, plus hourly labour if the wiring needs it
      quote: reasons.length ? 350 : 290,
      onSite: true, siteAddress: String(siteAddress).trim(), approxTime: String(approxTime).trim(),
      preferredLocationId, preferredDays, notes,
    },
  };
}

//   1. install fee: $200 standard / $300 complex, $0 if subsidised (fee waived, still shown as a line)
//   2. first month = the customer's own monthly service item ($165, $172 with theft protection, $115 / $122 subsidised)
//   e.g. standard, full price, no theft protection: 200 + 165 = $365 (matches Timely today)
function installCharge(c, services, { complex = false, today } = {}) {
  const d = customerDates(c, today);
  const sub = c.subsidised && (d.subsidyActive || !today);
  const tp = c.theftProtection !== false;
  const fee = services.find(s => s.id === (sub ? 'inst-sub' : complex ? 'inst-cx' : 'inst'));
  const month = services.find(s => s.group === 'service' && !!s.subsidised === !!sub && !!s.theftProtection === tp);
  const lines = [
    { id: fee.id, name: fee.name, price: fee.price },
    { id: month.id, name: `${month.name} — first month`, price: month.price },
  ];
  return { lines, total: lines.reduce((a, l) => a + l.price, 0) };
}

    if (!me || !me.length) return renderLogin('Logged in, but this login is not set up as staff yet. Run the staff insert in Supabase, then log in again.');
    S.me = me[0].name;
    await withTimeout(loadSessions(), 20000, 'Loading sessions');
    render();
    finishGcalConnect();
  } catch (e) { renderLogin(errMsg(e)); }
}

// ---------- data ----------
async function loadSessions() {
  const today = nzToday();
  const { data, error } = await db.rpc('sessions_between', { from_date: addDays(today, -7), to_date: addDays(today, 28) });
  if (error) return toast(errMsg(error), true);
  S.sessions = data;
  const dates = [...new Set(data.map(s => s.session_date))];
  if (!S.date || !dates.includes(S.date)) S.date = dates.find(d => d >= today) || dates[0];
  await loadBookings();
}
async function loadBookings(noLock) {
  const { data, error } = await db.from('bookings')
    .select('*, customer:customers(*)')
    .eq('session_date', S.date).neq('status', 'cancelled').order('start_min');
  if (error) return toast(errMsg(error), true);
  const ids = data.map(b => b.id);
  let pays = [];
  if (ids.length) { const r = await db.from('payments').select('*').in('booking_id', ids); pays = r.data || []; }
  data.forEach(b => b.payments = pays.filter(p => p.booking_id === b.id));
  const vids = [...new Set(data.map(b => b.vehicle_id).filter(Boolean))]; let vehs = [];
  if (vids.length) { const r = await db.from('customer_vehicles').select('*').in('id', vids); vehs = r.data || []; }
  data.forEach(b => b.vehicle = vehs.find(v => v.id === b.vehicle_id) || null);
  const ocids = [...new Set(data.map(b => b.customer_id))]; let ovs = [];
  if (ocids.length) { const r = await db.from('service_due_overrides').select('*').in('customer_id', ocids); ovs = r.data || []; }
  data.forEach(b => { if (b.customer) b.customer.due_overrides = ovs.filter(o => o.customer_id === b.customer_id); });
  const cids = [...new Set(data.map(b => b.customer_id))]; let bills = [];
  if (cids.length) { const r = await db.from('bills').select('id,customer_id,booking_id,description,amount_cents,status,sent_via,created_at').in('customer_id', cids).neq('status', 'cancelled'); bills = r.data || []; }
  data.forEach(b => { b.bill = bills.find(x => x.booking_id === b.id); b.owing = bills.filter(x => x.customer_id === b.customer_id && x.status === 'sent' && x.booking_id !== b.id); });
  S.bookings = data;
  await loadCredits(cids);
  await loadPriceReqs();
  // Keep each pencilled install's stored time in step with its estimate (the customer app and reminders read it).
  if (!noLock) {
    const drift = data.filter(b => isInstall(b) && !b.details.locked && b.status !== 'cancelled')
      .map(b => [b, installEstimate(b, S.sessions.find(x => x.session_date === b.session_date && x.location_id === b.location_id))]).filter(([b, t]) => t !== b.start_min);
    if (drift.length) await Promise.all(drift.map(([b, t]) => db.from('bookings').update({ start_min: t }).eq('id', b.id).then(r => { if (!r.error) b.start_min = t; })));
  }
  // On the day itself, pencilled installs lock at their estimated time (once, then reload).
  if (!noLock && S.date === nzToday()) {
    const open = data.filter(b => isInstall(b) && !b.details.locked && b.status !== 'cancelled');
    if (open.length) {
      const rs = await Promise.all(open.map(b => db.from('bookings').update({ start_min: installEstimate(b, S.sessions.find(x => x.session_date === b.session_date && x.location_id === b.location_id)), details: { ...b.details, locked: true } }).eq('id', b.id)));
      if (rs.every(r => !r.error)) { toast('Today\'s install times are now locked in'); return loadBookings(true); }
    }
  }
  // On the day itself, approved removals take their solid time (once, then reload).
  if (!noLock && S.date === nzToday()) {
    const locs = [...new Set(data.filter(b => floating(b) && b.approved_at).map(b => b.location_id))];
    if (locs.length) {
      const rs = await Promise.all(locs.map(l => db.rpc('lock_removals', { p_location: l, p_date: S.date })));
      if (rs.every(r => !r.error)) { toast('Approved removals now have their time locked in'); return loadBookings(true); }
    }
  }
}

// Account credit per customer: sum of customer_credits rows (+ added, − used). Hidden until step3 SQL is run.
async function loadCredits(custIds) {
  if (!custIds.length) return;
  const { data, error } = await db.from('customer_credits').select('customer_id, amount_cents').in('customer_id', custIds);
  if (error) { S.creditsOff = true; return; }
  S.creditsOff = false;
  custIds.forEach(id => S.credits[id] = 0);
  (data || []).forEach(r => S.credits[r.customer_id] = (S.credits[r.customer_id] || 0) + r.amount_cents);
}

function profileFlag0(c, b) {

    const upd = { details, duration_mins: mins };

    const { error } = await db.from('bookings').update(upd).eq('id', b.id);

    toast(extra ? (extra.locked ? 'Install time locked' : 'Unlocked — it moves with bookings again') : 'Saved'); await loadBookings(true); renderRun();

// ---------- one session: change hours, block times, close ----------
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
// The placeholder "customer" that blocked times are filed under. No mobile or email, so it never gets texts or reminders.
async function blockCustomerId() {
  const f = await db.from('customers').select('id').eq('first_name', '⛔ Blocked').eq('last_name', 'time').limit(1);
  if (f.data && f.data.length) return f.data[0].id;
  const r = await db.from('customers').insert({ first_name: '⛔ Blocked', last_name: 'time', subsidised: false, theft_protection: false,
    notes: 'Placeholder used by the run sheet to block out times. Do not delete.' }).select('id').single();
  if (r.error) throw r.error;
  return r.data.id;
}
function renderSessionTools(locId, blockAt = null) {
  const el = $('side'), s = S.sessions.find(x => x.location_id === locId && x.session_date === S.date);
  if (!s) return renderSide();
  const live = S.bookings.filter(b => b.location_id === locId && !isBlock(b) && b.status !== 'cancelled');
  const slots = slotTimes({ start: s.start_min, end: s.end_min, slotMins: s.slot_mins });
  el.innerHTML = `<div class="label">${esc(LOC(locId))} · ${longDate(S.date)}</div><h2>Session ${fmtTime(s.start_min)}–${fmtTime(s.end_min)}</h2>
    <p class="empty">${live.length ? `${live.length} customer${live.length > 1 ? 's' : ''} booked.` : 'Nobody booked yet.'}</p>

    <div class="label" style="margin-top:12px">Block out a time</div>
    <div class="empty">Nobody can book a blocked time, e.g. while you're at another job. Unblock any time by tapping it.</div>
    <div class="grid2"><div><label class="label" for="bkS">From</label><select id="bkS" style="width:100%">${slots.map(t => `<option value="${t}" ${t === (blockAt ?? s.start_min) ? 'selected' : ''}>${fmtTime(t)}</option>`).join('')}</select></div>
      <div><label class="label" for="bkE">Until</label><select id="bkE" style="width:100%">${slots.map(t => t + s.slot_mins).map(t => `<option value="${t}" ${t === (blockAt != null ? blockAt + s.slot_mins : s.end_min) ? 'selected' : ''}>${fmtTime(t)}</option>`).join('')}</select></div></div>
    <input id="bkN" placeholder="Note (optional, e.g. install in Te Awamutu)" style="width:100%;margin-top:6px">
    <button class="btn" id="bkGo" style="width:100%;margin-top:6px">Block these times</button>

    <div class="label" style="margin-top:16px">Change hours this day</div>
    <div class="empty">Start earlier or finish later to add slots, or shorten it.</div>
    <div class="grid2"><div><label class="label" for="hrS">Start</label><input id="hrS" type="time" step="300" value="${hhmm(s.start_min)}" style="width:100%"></div>
      <div><label class="label" for="hrE">Finish</label><input id="hrE" type="time" step="300" value="${hhmm(s.end_min)}" style="width:100%"></div></div>
    <button class="btn ghost" id="hrGo" style="width:100%;margin-top:6px">Save new hours</button>

    <div class="label" style="margin-top:16px">Close this session</div>
    <div class="empty">Takes it off the app so nobody can book. Undo it from the Schedule tab.</div>
    <input id="clN" placeholder="Note (optional, e.g. no bookings)" style="width:100%;margin-top:6px">
    <button class="btn ghost" id="clGo" style="width:100%;margin-top:6px;color:var(--bad)">Close ${esc(LOC(locId))} ${longDate(S.date)}</button>
    <button class="btn ghost" id="stBack" style="width:100%;margin-top:14px">Back</button>`;
  $('stBack').onclick = () => renderSide();
  $('bkGo').onclick = async () => {
    const from = +$('bkS').value, to = +$('bkE').value;
    if (to <= from) return toast('"Until" must be after "From"', true);
    const taken = new Set(S.bookings.filter(b => b.location_id === locId && b.status !== 'cancelled' && !floating(b)).flatMap(b => { const o = []; for (let t = b.start_min; t < b.start_min + (b.duration_mins || 5); t += s.slot_mins) o.push(t); return o; }));
    const todo = slots.filter(t => t >= from && t < to && !taken.has(t));
    if (!todo.length) return toast('Those times are already booked or blocked', true);
    $('bkGo').disabled = true;
    try {
      const cid = await blockCustomerId(), note = $('bkN').value.trim().slice(0, 80) || null;
      const rows = todo.map(t => ({ customer_id: cid, service_id: 'labour', location_id: locId, session_date: S.date, start_min: t, duration_mins: s.slot_mins,
        kind: 'service', status: 'confirmed', source: 'staff', price_cents: 0, details: { block: true, note } }));
      // one at a time, so a slot that turns out to be taken just gets skipped
      let ok = 0, lastErr = null;
      for (const r of rows) { const { error } = await db.from('bookings').insert(r); if (error) lastErr = error; else ok++; }
      if (!ok) throw lastErr || new Error('Could not block those times');
      const skipped = slots.filter(t => t >= from && t < to).length - ok;
      toast(`Blocked ${ok} slot${ok > 1 ? 's' : ''}${skipped ? ` (${skipped} already taken, left as is)` : ''}`);
      await loadBookings(true); renderRun();
    } catch (e) { $('bkGo').disabled = false; toast(errMsg(e), true); }
  };
  $('hrGo').onclick = async () => {
    const st = hmOf($('hrS').value), en = hmOf($('hrE').value);
    if (!(en > st)) return toast('Finish must be after start', true);
    const outside = live.filter(b => !floating(b) && b.kind === 'service' && b.source !== 'walkin' && (b.start_min < st || b.start_min >= en));
    if (outside.length && $('hrGo').dataset.sure !== `${st}-${en}`) {
      $('hrGo').dataset.sure = `${st}-${en}`; $('hrGo').textContent = 'Tap again to save anyway';
      return toast(`${outside.length} booking${outside.length > 1 ? 's are' : ' is'} outside those hours (${outside.map(b => fmtTime(b.start_min)).join(', ')}). Move or contact them.`, true);
    }
    $('hrGo').disabled = true;
    // a one-off extra session is edited directly; a normal session gets "different hours" for this day
    const once = await db.from('schedules').select('id').eq('id', `once-${locId}-${S.date}`);
    let r;
    if (once.data && once.data.length) r = await db.from('schedules').update({ start_min: st, end_min: en }).eq('id', once.data[0].id);
    else {
      await db.from('schedule_exceptions').delete().eq('location_id', locId).eq('date', S.date).eq('kind', 'override');
      r = await db.from('schedule_exceptions').insert({ location_id: locId, date: S.date, kind: 'override', start_min: st, end_min: en, note: null });
    }
    if (r.error) { $('hrGo').disabled = false; return toast(errMsg(r.error), true); }
    toast(`${LOC(locId)} now ${fmtTime(st)}–${fmtTime(en)} on ${longDate(S.date)}`); await loadSessions(); renderRun();
  };
  $('clGo').onclick = async () => {
    if (live.length && $('clGo').dataset.sure !== '1') {
      $('clGo').dataset.sure = '1'; $('clGo').textContent = `${live.length} booked — tap again to close anyway`;
      return toast(`${live.length} customer${live.length > 1 ? 's are' : ' is'} booked. They are not told automatically — use "Text this session" first.`, true);
    }
    if ($('clGo').dataset.sure !== '1' && $('clGo').dataset.sure !== '2') { $('clGo').dataset.sure = '2'; $('clGo').textContent = 'Tap again to close'; return; }
    $('clGo').disabled = true;
    const { error } = await db.from('schedule_exceptions').insert({ location_id: locId, date: S.date, kind: 'closed', note: $('clN').value.trim() || null });
    if (error) { $('clGo').disabled = false; return toast(errMsg(error), true); }
    toast(`${LOC(locId)} closed for ${longDate(S.date)} — undo from the Schedule tab`); await loadSessions(); render();
  };
}

// After this visit: when the next service is due. Matt can move that one month (e.g. over Christmas).
function nextDueBox(b, ev) {

async function setNextDue(b, normal, due) {
  const vid = b.vehicle_id || null;
  let del = db.from('service_due_overrides').delete().eq('customer_id', b.customer_id).eq('normal_due', normal);
  del = vid ? del.eq('vehicle_id', vid) : del.is('vehicle_id', null);
  const { error: e1 } = await del; if (e1) return toast(errMsg(e1), true);
  if (due && due !== normal) {
    const { error } = await db.from('service_due_overrides').insert({ customer_id: b.customer_id, vehicle_id: vid, normal_due: normal, due });
    if (error) return toast(errMsg(error), true);
  }
  toast(due && due !== normal ? 'Next service moved to ' + yDate(due) : 'Next service back to ' + yDate(normal)); await loadBookings(); renderRun();
}
function billBox(b, paid) {

function wireBills(el, b, after) {
  const ns = $('nsBill');

    ns.disabled = true;
    const { data, error } = await db.rpc('send_bill', { p_customer: b.customer_id, p_booking: b.id, p_amount_cents: NO_SHOW_FEE * 100, p_description: 'No-show fee, ' + longDate(b.session_date) });

// ---------- Google Calendar: bookings copied to the business calendar within about a minute ----------
async function renderGcal() {

  if (error) { box.textContent = /gcal_status/.test(errMsg(error)) ? 'Not set up yet.' : errMsg(error); return; }
  const when = t => t ? new Date(t).toLocaleString('en-NZ', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Pacific/Auckland' }) : 'never';
  if (!g.ready) { box.innerHTML = 'Not set up yet. The Google details (google_client_id and google_client_secret) need adding to the Supabase Vault first.'; return; }
  if (!g.connected) {
    box.innerHTML = `<p>Not connected. Connecting copies every booking, change and cancellation to your Google calendar within about a minute.</p><button class="btn" id="gcGo">Connect Google Calendar</button>
      <p class="empty" style="margin-top:6px">Sign in as the business Google account when Google asks.</p>`;
    $('gcGo').onclick = async () => { $('gcGo').disabled = true; const r = await db.rpc('gcal_auth_url'); if (r.error) { $('gcGo').disabled = false; return toast(errMsg(r.error), true); }
      location.href = r.data; };
    return;
  }
  box.innerHTML = `<p><b>Connected.</b> Last copied ${when(g.last_sync_at)}${g.waiting ? ' · ' + g.waiting + ' waiting' : ''}${g.failed ? ' · <span style="color:var(--bad)">' + g.failed + ' could not be copied</span>' : ''}.</p>
    ${g.last_error ? `<div class="alert">${esc(g.last_error)}</div>` : ''}<button class="chip" id="gcOff">Disconnect</button>`;
  $('gcOff').onclick = async () => {
    if ($('gcOff').dataset.sure !== '1') { $('gcOff').dataset.sure = '1'; $('gcOff').textContent = 'Tap again to disconnect'; return; }
    const r = await db.rpc('gcal_disconnect'); if (r.error) return toast(errMsg(r.error), true); toast('Disconnected. Events already in Google stay there.'); renderGcal();
  };
}
// Coming back from Google's approval screen: hand the one-time code to the database, then tidy the address.

function showSide() { if (matchMedia('(max-width:960px)').matches) setTimeout(() => $('side')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
async function undoPayment(b) {
  const { error } = await db.from('payments').delete().eq('booking_id', b.id);
  if (error) return toast(errMsg(error), true);
  // give back any account credit this sale used
  const { credit_used_cents, ...restDetails } = b.details || {};
  if (credit_used_cents) await db.from('customer_credits').delete().eq('booking_id', b.id).lt('amount_cents', 0);
  await db.from('bookings').update({ status: 'arrived', ...(credit_used_cents ? { details: restDetails } : {}) }).eq('id', b.id);
  S.useCredit = !!credit_used_cents;
  const pr = b.payments[0]?.provider_ref || '';
  S.extras = pr.startsWith('extras2:') ? (() => { try { return JSON.parse(pr.slice(8)); } catch (e) { return []; } })()
    : pr.startsWith('extras:') ? pr.slice(7).split(',') : [];
  toast('Sale cancelled — redo it below'); await loadBookings(); renderRun();
}

async function setStatus(b, st) {
  const { error } = await db.from('bookings').update({ status: st, ...(st === 'cancelled' ? { cancelled_at: new Date().toISOString() } : {}) }).eq('id', b.id);
  if (error) return toast(errMsg(error), true);
  toast(st === 'cancelled' ? 'Booking cancelled — the slot is free again' : 'Updated');
  if (st === 'cancelled') S.sel = null;
  await loadBookings(); renderRun();
}
// Change what this customer pays for the booked item (goodwill, agreed price…). Keeps the original price and the reason.
async function changePrice(b, price, why) {
  if (!(price >= 0)) return toast('Enter a price of $0 or more', true);
  if (!why) return toast('Add a short reason', true);
  const orig = b.details?.orig_price_cents ?? b.price_cents, cents = Math.round(price * 100);
  const details = { ...(b.details || {}), orig_price_cents: orig, price_note: why };
  if (cents === orig) { delete details.orig_price_cents; delete details.price_note; }
  const { error } = await db.from('bookings').update({ price_cents: cents, details }).eq('id', b.id);
  if (error) return toast(errMsg(error), true);
  toast('Price changed to ' + money(price)); await loadBookings(true); renderRun();
}
async function takePayment(b, method, total, creditUse = 0) {
  if (total < 0) return toast('Total is below $0 — reduce the discount', true);
  document.querySelectorAll('[data-pay]').forEach(x => x.disabled = true);
  const { error } = await db.from('payments').insert({ booking_id: b.id, customer_id: b.customer_id, amount_cents: Math.round(total * 100), method,
    provider_ref: !S.extras.length ? null : S.extras.every(x => typeof x === 'string') ? 'extras:' + S.extras.join(',') : 'extras2:' + JSON.stringify(S.extras) });
  if (error) { document.querySelectorAll('[data-pay]').forEach(x => x.disabled = false); return toast(errMsg(error), true); }
  if (creditUse > 0) {
    const r = await db.from('customer_credits').insert({ customer_id: b.customer_id, booking_id: b.id, amount_cents: -Math.round(creditUse * 100), reason: 'Used at checkout ' + longDate(b.session_date) });
    if (r.error) toast('Paid, but the credit could not be taken off their account: ' + errMsg(r.error), true);
  }
  await db.from('bookings').update({ status: 'completed', ...(creditUse > 0 ? { details: { ...(b.details || {}), credit_used_cents: Math.round(creditUse * 100) } } : {}) }).eq('id', b.id);
  S.extras = []; S.useCredit = false; toast(total ? `Paid ${money(total)}` : 'Done — covered by account credit'); await loadBookings(); renderRun();
}

    $('abPick').querySelectorAll('[data-s]').forEach(btn => btn.onclick = async () => {
      let details = selV ? { vehicle_id: selV.id } : {};
      if (btn.dataset.s === 'rem') {
        const req = removalRequirements(eng(c), S.date);
        if (!$('remRef')) {
          $('remExtra').innerHTML = req.temporary
            ? `<label class="label" for="remRef" style="margin-top:8px;display:block">NZTA temporary removal approval number</label><input id="remRef" style="width:100%"><button class="btn" id="remGo" style="margin-top:6px">Book removal</button>`
            : `<label class="label" style="margin-top:8px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="remRef"> I've seen their zero alcohol licence</label><button class="btn" id="remGo" style="margin-top:6px">Book removal</button>`;
          $('remGo').onclick = () => {
            details = { ...details, ...(req.temporary ? { nztaApprovalRef: $('remRef').value.trim() } : ($('remRef').checked ? { zeroAlcoholLicencePhoto: 'seen in person by staff' } : {})) };
            doBook(c, 'rem', details, selV);
          };
          return;
        }
      }
      doBook(c, btn.dataset.s, details, selV);
    });
  }
  async function doBook(c, svc, details, selV) {
    if (walkin) return doWalkin(c, svc, selV, details);
    const { data, error } = await db.rpc('book_next_slot', { p_location: locId, p_date: S.date, p_service: svc, p_details: details, p_customer: c.id });
    if (error) return toast(errMsg(error), true);
    toast(`Booked ${fullName(c)} at ${fmtTime(data.start_min)}`); S.sel = data.id; await loadBookings(); renderRun();
  }
  // Walk-in: recorded at the current time (off the 5-min grid), already arrived, straight to checkout.
  async function doWalkin(c, svcId, selV, details = {}) {
    const blank = svcId === '__blank';
    // blank sale: filed under 'Additional labour' at $0 so the database is happy; the real lines are added at checkout
    const svc = blank ? { ...SVC('labour'), price: 0, duration: 5 } : allowedServices(engV(c, selV), services, S.date).find(s => s.id === svcId) || SVC(svcId);
    const { vehicle_id, ...det } = details;
    if (blank) det.blank = true;
    if (svcId === 'rem' && removalRequirements(eng(c), S.date).temporary) det.temporary = true;
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Pacific/Auckland' }));
    const sess = S.sessions.find(x => x.location_id === locId && x.session_date === S.date);
    let t = S.date === nzToday() ? now.getHours() * 60 + now.getMinutes() : (sess ? sess.end_min : 720);
    const used = new Set(S.bookings.filter(b => b.location_id === locId).map(b => b.start_min));
    while (used.has(t)) t++;
    const rowW = { vehicle_id: selV ? selV.id : null, customer_id: c.id, service_id: svc.id, location_id: locId, session_date: S.date, start_min: t,
      duration_mins: svc.duration || 5, kind: 'service', status: 'arrived', source: 'walkin', price_cents: Math.round((svc.price || 0) * 100), details: det };
    // a walk-in is on the sheet but holds no bookable slot
    let { data, error } = await db.from('bookings').insert({ ...rowW, time_locked: false }).select().single();
    if (error && /time_locked/.test(errMsg(error))) ({ data, error } = await db.from('bookings').insert(rowW).select().single());
    if (error) return toast(errMsg(error), true);
    toast(`Walk-in added: ${fullName(c)}`); S.sel = data.id; S.extras = []; S.useCredit = false; await loadBookings(); renderRun();
  }
}

// ---------- schedule changes (public holidays, moved days, one-off sessions) ----------
async function renderSchedule() {
  const today = nzToday(), locs = locations.filter(l => l.onlineBookable !== false);
  const [ex, on] = await Promise.all([
    db.from('schedule_exceptions').select('*').gte('date', today).order('date'),
    db.from('schedules').select('*').eq('rule->>type', 'once')]);
  if (ex.error || on.error) return toast(errMsg(ex.error || on.error), true);
  const extras = (on.data || []).filter(x => x.rule.date >= today).sort((a, b) => a.rule.date.localeCompare(b.rule.date));
  const KIND = { closed: 'Cancelled', override: 'Different hours', moved: 'Note' };
  $('body').innerHTML = `<div class="layout"><div class="panel"><h2>Changes coming up</h2>
      <div class="list">${[
        ...ex.data.map(e => `<div class="item"><span><b>${esc(LOC(e.location_id))} · ${longDate(e.date)}</b><br><span class="empty">${KIND[e.kind] || e.kind}${e.kind === 'override' ? ` ${fmtTime(e.start_min)}–${fmtTime(e.end_min)}` : ''}${e.note ? ' · ' + esc(e.note) : ''}</span></span><button class="chip" data-delx="${e.id}">Undo</button></div>`),
        ...extras.map(x => `<div class="item"><span><b>${esc(LOC(x.location_id))} · ${longDate(x.rule.date)}</b><br><span class="empty">Extra session ${fmtTime(x.start_min)}–${fmtTime(x.end_min)}</span></span><button class="chip" data-dels="${esc(x.id)}">Remove</button></div>`)
      ].join('') || '<div class="empty">No changes. Every location runs to its normal pattern.</div>'}</div></div>
    <aside class="panel side"><h2>Change a day</h2>
      <p class="empty">To move a session off a public holiday: cancel the usual day, then add an extra session on the new day.</p>
      <form class="form" id="scf">
        <label class="label" for="scK">What</label><select id="scK"><option value="closed">Cancel this day</option><option value="override">Different hours this day</option><option value="once">Add an extra session</option></select>
        <label class="label" for="scL">Location</label><select id="scL">${locs.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select>
        <label class="label" for="scD">Date</label><input id="scD" type="date" min="${today}" required>
        <div id="scT" hidden><div class="grid2"><div><label class="label" for="scS">Start</label><input id="scS" type="time" step="300"></div><div><label class="label" for="scE">Finish</label><input id="scE" type="time" step="300"></div></div></div>
        <label class="label" for="scN">Note for the run sheet (optional)</label><input id="scN" placeholder="e.g. Labour Day">
        <button class="btn brand" id="scGo">Save</button></form></aside></div>`;
  $('scK').onchange = () => { $('scT').hidden = $('scK').value === 'closed'; };
  document.querySelectorAll('[data-delx]').forEach(b => b.onclick = async () => { const { error } = await db.from('schedule_exceptions').delete().eq('id', b.dataset.delx); if (error) return toast(errMsg(error), true); await loadSessions(); renderSchedule(); toast('Undone'); });
  document.querySelectorAll('[data-dels]').forEach(b => b.onclick = async () => { const { error } = await db.from('schedules').delete().eq('id', b.dataset.dels); if (error) return toast(errMsg(error), true); await loadSessions(); renderSchedule(); toast('Removed'); });
  $('scf').onsubmit = async e => {
    e.preventDefault();
    const kind = $('scK').value, loc = $('scL').value, date = $('scD').value, note = $('scN').value.trim() || null;
    if (!date) return toast('Pick a date', true);
    let st = null, en = null;
    if (kind !== 'closed') { if (!$('scS').value || !$('scE').value) return toast('Enter the start and finish times', true); st = hmOf($('scS').value); en = hmOf($('scE').value); if (en <= st) return toast('Finish must be after start', true); }
    const { data: sess, error: e1 } = await db.rpc('sessions_between', { from_date: date, to_date: date }); if (e1) return toast(errMsg(e1), true);
    const has = sess.some(x => x.location_id === loc);
    if (kind === 'once' && has) return toast(`${LOC(loc)} already has a session that day — use "Different hours" instead`, true);
    if (kind !== 'once' && !has) return toast(`${LOC(loc)} has no session on that date`, true);
    if (kind !== 'once') {
      const { count } = await db.from('bookings').select('id', { count: 'exact', head: true }).eq('location_id', loc).eq('session_date', date).neq('status', 'cancelled');
      if (count && $('scGo').dataset.sure !== date + kind) { $('scGo').dataset.sure = date + kind; $('scGo').textContent = `${count} booked that day — tap again to confirm`; return toast(`${count} customer${count > 1 ? 's are' : ' is'} booked that day. They are not told automatically yet — contact them.`, true); }
    }
    const r = kind === 'once'
      ? await db.from('schedules').insert({ id: `once-${loc}-${date}`, location_id: loc, rule: { type: 'once', date }, start_min: st, end_min: en, slot_mins: 5, removal_slots: 3, removal_mins: 15 })
      : await db.from('schedule_exceptions').insert({ location_id: loc, date, kind, start_min: st, end_min: en, note });
    if (r.error) return toast(errMsg(r.error), true);
    if (kind === 'once' && note) await db.from('schedule_exceptions').insert({ location_id: loc, date, kind: 'moved', note });
    await loadSessions(); renderSchedule(); toast('Saved');
  };
}

async function creditPanel(box, custId, onChange) {

  if (error) { box.innerHTML = `<div class="empty">Account credit isn't switched on yet — run step3-custom-lines-and-credit.sql in Supabase.</div>`; return; }
  const bal = data.reduce((a, r) => a + r.amount_cents, 0) / 100;
  box.innerHTML = `<div class="label">Account credit</div><div class="co-total" style="padding-top:2px;font-size:1.3rem"><span>Balance</span><span class="t ${bal > 0 ? 'credit' : ''}">${money(bal)}</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center">$<input class="crAmt" type="number" inputmode="decimal" step="0.01" placeholder="amount" style="width:90px" aria-label="Credit amount">
      <input class="crWhy" placeholder="Reason, e.g. overpaid last month" style="flex:1 1 140px"><button class="btn ghost crAdd">Add credit</button></div>
    <div class="empty" style="font-size:.8rem;margin-top:2px">Comes off their next bill when you tick “Use account credit” at checkout. Use a minus amount to take credit back off.</div>
    ${data.length ? `<div style="margin-top:8px">${data.slice(0, 12).map(r => `<div class="co-line" style="font-size:.88rem"><span>${billDay(r.created_at)} · ${esc(r.reason || '')}</span><span class="t ${r.amount_cents > 0 ? 'credit' : ''}">${r.amount_cents > 0 ? '+' : '−'}${money(Math.abs(r.amount_cents) / 100)}</span></div>`).join('')}</div>` : ''}`;
  box.querySelector('.crAdd').onclick = async () => {
    const amt = parseFloat(box.querySelector('.crAmt').value), why = box.querySelector('.crWhy').value.trim();
    if (!amt) return toast('Enter an amount', true);
    if (!why) return toast('Add a reason', true);
    if (amt < 0 && -amt > bal + 0.001) return toast(`They only have ${money(bal)} credit`, true);
    const { error } = await db.from('customer_credits').insert({ customer_id: custId, amount_cents: Math.round(amt * 100), reason: why.slice(0, 120) });
    if (error) return toast(errMsg(error), true);
    toast(amt > 0 ? `Added ${money(amt)} credit` : `Took ${money(-amt)} credit off`);
    S.credits[custId] = Math.round((bal + amt) * 100);
    onChange ? onChange() : creditPanel(box, custId);
  };
}

      <label class="full">Alert (shows in red at checkout)<input id="f_al" value="${esc(c.alerts)}"></label>
      <label class="full">Notes<textarea id="f_no" rows="3">${esc(c.notes)}</textarea></label>
      <div class="full empty">Apply date ${yDate(d.exitEligible)} · subsidy ${d.subsidyActive ? (d.subsidyOverdue ? 'ACTIVE, 15 months passed ' + yDate(d.subsidyEnds) + ' — untick Subsidised when Dräger emails' : d.subsidyEnds ? 'expected until ' + yDate(d.subsidyEnds) : 'active') : 'none'}<span id="nsd">${(w => w ? ' · next service due ' + yDate(w.due) : '')(serviceWindow(eng(c), nzToday()))}</span></div>
      <div class="full"><button class="btn brand">Save</button></div></form>
    <div id="vehBox" style="margin-top:16px;border-top:1px solid var(--line);padding-top:10px"></div>
    <div id="credBox" style="margin-top:16px;border-top:1px solid var(--line);padding-top:10px"></div>`;
  loadVehicles(c);
  creditPanel($('credBox'), c.id);
  if ($('edBack')) $('edBack').onclick = after;
  wirePriceReq(el, after);
  if ($('mkChecked')) $('mkChecked').onclick = async () => {
    const { error } = await db.from('customers').update({ self_registered: false }).eq('id', c.id);
    if (error) return toast(errMsg(error), true); toast('Marked as checked'); after();
  };
  if ($('joinOpen')) $('joinOpen').onclick = () => {
    $('joinBox').innerHTML = `<input id="jq" placeholder="Find their existing record (name or mobile)" style="width:100%;margin-top:8px" autocomplete="off"><div class="list" id="jlist"></div>`;
    let jt; $('jq').oninput = () => { clearTimeout(jt); jt = setTimeout(async () => {
      const q = $('jq').value.trim().replace(/[,()%]/g, ' '); if (q.length < 2) return $('jlist').innerHTML = '';
      const { data } = await db.from('customers').select('*').neq('id', c.id).or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,mobile.ilike.%${q}%`).order('first_name').limit(8);
      $('jlist').innerHTML = (data || []).map(x => `<div class="item"><span><b>${esc(fullName(x))}</b><br><span class="empty">${esc(x.mobile || 'no mobile')} · installed ${yDate(x.install_date)}</span></span><button class="btn ghost" data-join="${x.id}">Join into this one</button></div>`).join('') || '<div class="empty">No match</div>';
      $('jlist').querySelectorAll('[data-join]').forEach(bn => bn.onclick = async () => {
        if (bn.dataset.sure !== '1') { bn.dataset.sure = '1'; bn.textContent = 'Tap again to join'; bn.className = 'btn'; return; }
        const { error } = await db.rpc('merge_customers', { p_keep: bn.dataset.join, p_drop: c.id });
        if (error) return toast(errMsg(error), true); toast('Joined — bookings moved across'); after();
      });
    }, 250); };
    $('jq').focus();
  };
  db.from('bookings').select('service_id,status,session_date').eq('customer_id', c.id).eq('status', 'completed').gte('session_date', addDays(nzToday(), -45)).then(r => {
    const w = serviceWindow(eng(c), nzToday(), servicedDates(r.data || [], services)); if (w && $('nsd')) $('nsd').textContent = ' · next service due ' + yDate(w.due);
  });
  $('f_lv').onchange = () => { const x = $('f_lv').value; if (!x) return; const six = addMonths(x, 6), inst = $('f_inst').value, std = inst ? addMonths(inst, 12) : six; $('f_ad').value = six > std ? six : std; };
  $('cf').onsubmit = async e => {
    e.preventDefault();
    const v = id => $(id).value.trim() || null;
    const upd = { first_name: v('f_first'), last_name: v('f_last'), mobile: v('f_mob'), email: v('f_em'), install_date: v('f_inst'), vehicle: v('f_veh'),
      subsidised: $('f_sub').checked, theft_protection: $('f_tp').checked, subsidy_start: v('f_ss'), rollover_date: v('f_ro'), alerts: v('f_al'), notes: v('f_no') };
    const lv = v('f_lv'); if (lv !== (c.last_violation_date || null)) upd.last_violation_date = lv;
    const ad = v('f_ad'); if (ad !== c.apply_date) Object.assign(upd, { apply_date: ad, apply_date_set_by: ad ? 'staff' : null, apply_date_set_on: ad ? new Date().toISOString() : null });
    const { error } = await db.from('customers').update(upd).eq('id', c.id);
    if (error) return toast(/duplicate|unique/i.test(errMsg(error)) ? 'Another customer already has that mobile. Use "Join with existing customer" instead.' : errMsg(error), true);
    toast('Saved'); after();
  };
  el.insertAdjacentHTML('beforeend', `<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:10px"><button class="chip" id="delC" style="color:var(--bad)">Delete customer</button><div id="delBox"></div></div>`);
  $('delC').onclick = () => {
    $('delBox').innerHTML = `<div class="alert">Delete <b>${esc(fullName(c))}</b> and their past bookings for good? This cannot be undone.
      <div class="grid2" style="margin-top:8px"><button class="btn" id="delYes" style="background:var(--bad);border-color:var(--bad)">Yes, delete</button><button class="btn ghost" id="delNo">Keep</button></div></div>`;
    $('delNo').onclick = () => { $('delBox').innerHTML = ''; };
    $('delYes').onclick = async () => {
      $('delYes').disabled = true;
      const { error } = await db.rpc('delete_customer', { p_customer: c.id });
      if (error) { $('delBox').innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
      toast('Customer deleted'); if (target === 'side') { S.sel = null; } after();
    };
  };
}

// ---------- extra vehicles (the customer record above is their first vehicle) ----------
async function loadVehicles(c) {
  const box = $('vehBox'); if (!box) return;
  const { data, error } = await db.from('customer_vehicles').select('*').eq('customer_id', c.id).is('removed_at', null).order('created_at');
  const ov = await db.from('service_due_overrides').select('*').eq('customer_id', c.id); c.due_overrides = ov.data || [];
  if (error) { box.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
  const due = v => (w => w ? yDate(w.due) : '—')(serviceWindow(engV(c, v), nzToday()));
  const form = (v, i) => `<form class="form" data-vf="${i}" style="margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px">
      <label>Rego or name<input name="label" required maxlength="40" value="${esc(v ? v.label : '')}" placeholder="e.g. ABC123 or Work ute"></label>
      <label>Install date (this vehicle)<input name="install_date" type="date" value="${esc(v ? v.install_date : '')}"></label>
      <label class="full">Service date, if different from its install date<input name="rollover_date" type="date" value="${esc(v ? v.rollover_date : '')}"></label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="subsidised" ${v && v.subsidised ? 'checked' : ''}> Subsidised</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="theft_protection" ${!v || v.theft_protection ? 'checked' : ''}> Theft protection</label>
      ${v ? `<div class="full empty">Next service due <b style="color:var(--bad)">${due(v)}</b> · ${esc(SVC((v.subsidised ? 'sub' : 'svc') + (v.theft_protection ? '-tp' : '')).name)}</div>` : ''}
      <div class="full" style="display:flex;gap:6px"><button class="btn brand">${v ? 'Save vehicle' : 'Add vehicle'}</button>${v ? `<button type="button" class="btn ghost" data-vrm="${i}">Remove vehicle</button>` : ''}</div></form>`;
  box.innerHTML = `<h3 style="margin:0">Vehicles</h3>
    <div class="empty">First vehicle: <b>${esc(c.vehicle || 'not named')}</b> (the details above) · next service due <b style="color:var(--bad)">${due(null)}</b>. The apply date is the same for all their vehicles.</div>
    ${data.map((v, i) => form(v, i)).join('')}
    <div id="vehNew"><button class="btn ghost" id="vehAdd" style="margin-top:8px">+ Add another vehicle</button></div>`;
  const read = f => ({ label: f.label.value.trim(), install_date: f.install_date.value || null, rollover_date: f.rollover_date.value || null,
                       subsidised: f.subsidised.checked, theft_protection: f.theft_protection.checked });
  box.querySelectorAll('[data-vf]').forEach(f => f.onsubmit = async e => {
    e.preventDefault(); const v = data[+f.dataset.vf];
    const { error } = await db.from('customer_vehicles').update(read(f)).eq('id', v.id);
    if (error) return toast(errMsg(error), true); toast('Vehicle saved'); loadVehicles(c);
  });
  box.querySelectorAll('[data-vrm]').forEach(x => x.onclick = async () => {
    if (x.dataset.sure !== '1') { x.dataset.sure = '1'; x.textContent = 'Tap again to remove'; return; }
    const { error } = await db.from('customer_vehicles').update({ removed_at: new Date().toISOString() }).eq('id', data[+x.dataset.vrm].id);
    if (error) return toast(errMsg(error), true); toast('Vehicle removed'); loadVehicles(c);
  });
  $('vehAdd').onclick = () => {
    $('vehNew').innerHTML = form(null, 'new');
    const f = $('vehNew').querySelector('form'); f.label.focus();
    f.onsubmit = async e => {
      e.preventDefault();
      const { error } = await db.from('customer_vehicles').insert({ customer_id: c.id, ...read(f) });
      if (error) return toast(errMsg(error), true); toast('Vehicle added'); loadVehicles(c);
    };
  };
}

start();
</script>
</body>
